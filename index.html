<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmanPower Yapay Zeka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-container" class="container">
        <h2>İmanPower Yapay Zeka - Giriş</h2>
        <input type="email" id="email" placeholder="E-posta Adresiniz">
        <input type="password" id="password" placeholder="Şifreniz">
        <div class="auth-buttons">
            <button id="btn-login">Giriş Yap</button>
            <button id="btn-register">Kayıt Ol</button>
        </div>
    </div>

    <div id="chat-container" class="container hidden">
        <div class="chat-header">
            <h3>Hoş geldin, <span id="user-display">Kullanıcı</span></h3>
            <button id="btn-logout">Çıkış Yap</button>
        </div>
        
        <div id="chat-box" class="chat-box">
            </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Bir şeyler yazın...">
            <button id="btn-send">Gönder</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
