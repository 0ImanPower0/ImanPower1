<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power Zeka v3</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.75);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --text-color: #f1f5f9;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at center, #1e2640 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(0, 242, 254, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            box-sizing: border-box;
            transition: all 0.4s ease;
        }

        h2 { 
            text-align: center; 
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 15, 26, 0.8);
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--secondary-neon), var(--primary-neon));
            border: none;
            color: #0b0f19;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 12px;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
            cursor: pointer;
        }

        .toggle-link span { color: var(--primary-neon); font-weight: 600; }
        
        #chat-screen { display: none; height: 82vh; flex-direction: column; }
        
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            background: rgba(10, 15, 26, 0.6);
            margin-bottom: 15px;
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.2); border-radius: 10px; }

        .msg { 
            margin: 12px 0; 
            padding: 12px 16px; 
            border-radius: 16px; 
            max-width: 85%; 
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word; 
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg { 
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            margin-left: auto; 
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ai-msg { 
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.05)); 
            margin-right: auto; 
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0, 242, 254, 0.15);
        }

        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { margin: 0; }
        .chat-input-area button { margin: 0; width: auto; padding: 0 24px; }
        
        .header-area { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }
        
        .logout-btn { 
            background: linear-gradient(135deg, #ff416c, #ff4b2b); 
            color: white;
            padding: 6px 14px; 
            font-size: 13px; 
            width: auto; 
            margin: 0;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="login-screen">
        <h2>İman Power Zeka</h2>
        <p style="text-align: center; color: #64748b; font-size: 14px; margin-top: -8px;">Geleceğin Akıllı Bilgi Sistemi</p>
        <input type="text" id="login-username" placeholder="Kullanıcı Adı">
        <input type="password" id="login-password" placeholder="Şifre">
        <button onclick="login()">Sisteme Giriş Yap</button>
        <div class="toggle-link" onclick="switchScreen('register-screen')">Aramıza katılmak ister misin? <span>Kayıt Ol</span></div>
    </div>

    <div id="register-screen" style="display: none;">
        <h2>Yeni Profil Oluştur</h2>
        <p style="text-align: center; color: #64748b; font-size: 14px; margin-top: -8px;">Verilerin Güvenle Saklanacak</p>
        <input type="text" id="reg-username" placeholder="Kullanıcı Adı Belirle">
        <input type="password" id="reg-password" placeholder="Güçlü Bir Şifre">
        <button onclick="register()">Hesabı Oluştur</button>
        <div class="toggle-link" onclick="switchScreen('login-screen')">Zaten bir hesabın var mı? <span>Giriş Yap</span></div>
    </div>

    <div id="chat-screen">
        <div class="header-area">
            <h3 style="margin:0; font-size: 16px; color: var(--primary-neon);" id="welcome-user">Kullanıcı</h3>
            <button class="logout-btn" onclick="logout()">Güvenli Çıkış</button>
        </div>
        <div id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Bir şeyler sorun veya kelime yazın..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>
</div>

    const OZEL_SOZLUK = {
// --- MATEMATİK DERSİ ---
        "tam sayılar": "🔢 [7. Sınıf Matematik - Tam Sayılarla İşlemler]\n\nTam sayılar kümesi, pozitif tam sayılar (+), negatif tam sayılar (-) ve nötr olan sıfırın (0) birleşmesiyle oluşur. Bu konuda en çok dikkat etmen gereken şey 'İşaret Kuralları'dır:\n\n1. Toplama İşleminde: Aynı işaretli sayılar normal toplanır ve ortak işaret verilir. Zıt işaretli sayılar toplanırken, mutlak değerce büyük olan sayıdan küçük olan çıkarılır ve büyük sayının işareti sonuca verilir.\n2. Çarpma ve Bölme İşleminde: Aynı işaretli iki sayının çarpımı veya bölümü her zaman POZİTİF (+), zıt işaretli iki sayının çarpımı veya bölümü ise her zaman NEGATİF (-) sonuç doğurur.\n3. Üslü Nicelikler: Negatif bir tam sayının parantez dışındaki kuvveti ÇİFT ise sonuç pozitif, TEK ise sonuç negatif olur. Parantez yoksa kuvvet ne olursa olsun işaret değişmez!",
        
        "rasyonel sayılar": "🧮 [7. Sınıf Matematik - Rasyonel Sayılar]\n\na ve b birer tam sayı olmak ve b sıfırdan farklı olmak şartıyla 'a/b' şeklinde yazılabilen tüm sayılara rasyonel sayılar denir ve 'Q' sembolü ile gösterilir. Her tam sayının paydasında gizli bir '1' vardır, bu yüzden her tam sayı aynı zamanda bir rasyonel sayıdır. Bu ünitede rasyonel sayıları ondalık gösterime çevirmeyi, devirli ondalık sayıları rasyonel sayıya dönüştürmeyi ve rasyonel sayılarda dört işlemi (toplama, çıkarma, çarpma, bölme) çok iyi bilmelisin. Paydaları eşitlemeden toplama-çıkarma yapamayacağını sakın unutma!",
        
        "eşitlik ve denklem": "⚖️ [7. Sınıf Matematik - Eşitlik ve Denklem]\n\nİçinde en az bir bilinmeyen (x, y, a vb.) bulunan ve eşitlik içeren ifadelere birinci dereceden bir bilinmeyenli denklem denir. Denklemi çözerken amacımız bilinmeyeni yalnız bırakmaktır. Temel kural şudur: Bir sayı eşitliğin diğer tarafına geçerken İŞARET DEĞİŞTİRİR. Pozitif sayı negatif (-), negatif sayı pozitif (+), çarpım durumundaki sayı bölüm, bölüm durumundaki sayı ise çarpım olarak karşıya geçer. (Örn: x + 5 = 12 ise, x = 12 - 5 yani x = 7 bulunur).",
        
        "oran orantı": "📊 [7. Sınıf Matematik - Oran ve Orantı]\n\nİki çokluğun birbirine bölünerek karşılaştırılmasına 'oran', iki veya daha fazla oranın eşitliğine ise 'orantı' denir. İki tür orantı vardır:\n1. Doğru Orantı: İki çokluktan biri artarken diğeri de aynı oranda artıyorsa (veya biri azalırken diğeri de azalıyorsa) buna doğru orantı denir. Çapraz çarpım yapılarak çözülür.\n2. Ters Orantı: Çokluklardan biri artarken diğeri aynı oranda azalıyorsa buna ters orantı denir. Karşılıklı (yan yana) çarpım yapılarak çözülür.",

        // --- FEN BİLİMLERİ DERSİ ---
        "uzay araştırmaları": "🚀 [7. Sınıf Fen Bilimleri - Uzay Araştırmaları]\n\nİnsanların uzayı incelemek, keşfetmek ve bilgi toplamak için yaptığı tüm çalışmalara uzay araştırmaları denir. Bu ünitenin ana kavramları şunlardır:\n- Uzay İstasyonu: Bilim insanlarının uzayda uzun süre kalıp deneyler yaptığı devasa laboratuvarlardır.\n- Uzay Roketi: Uzay araçlarını atmosferin dışına taşımak için kullanılan güçlü araçlardır. Genelde tek kullanımlıktır.\n- Uzay Mekiği: Yeniden kullanılabilen, roket gibi havalanıp uçak gibi piste inebilen araçlardır.\n- Uzay Sondası: Uzaktan kumanda edilen, gezegenleri inceleyen insansız uzay araçlarıdır.\n- Rasathane (Gözlemevi): İçinde dev aynalı teleskopların bulunduğu, ışık kirliliğinden uzak, yüksek yerlere kurulan uzay gözlem merkezleridir.\n⚠️ Uzay Kirliliği: Dünyanın çevresinde dönen ve artık işlevi bitmiş yapay uydular, roket tankları ve enkazların oluşturduğu kirliliktir. Doğal gök cisimleri uzay kirliliğine neden olmaz!",
        
        "hücre": "🔬 [7. Sınıf Fen Bilimleri - Hücre ve Bölünmeler]\n\nHücre, canlıların canlılık özelliği gösteren en küçük yapı birimidir. Dıştan içe doğru Hücre Zarı, Sitoplazma ve Çekirdek olmak üzere 3 temel kısımdan oluşur. 7. sınıfta bitki ve hayvan hücrelerinin farklarını adın gibi bilmelisin:\n- Bitki Hücresi: Köşeli yapıdadır, hücre zarına ek olarak sert bir 'Hücre Duvarı' vardır, büyük ve az sayıda koful barındırır, fotosentez yapan 'Kloroplast' organeli vardır.\n- Hayvan Hücresi: Yuvarlak yapıdadır, hücre duvarı yoktur, kofulları küçük ve çok sayıdadır, hücre bölünmesini sağlayan 'Sentrozom' ve sindirim yapan 'Lizozom' organeli bulunur.",
        
        "bölünmeler": "🔄 [7. Sınıf Fen Bilimleri - Mitoz ve Mayoz Bölünme]\n\nCanlılarda hücre çoğalması iki farklı bölünme türüyle gerçekleşir:\n1. Mitoz Bölünme: Vücut hücrelerinde görülür. Bölünme sonucu 2 yeni hücre oluşur ve kromozom sayısı DEĞİŞMEZ (2n ise yine 2n kalır). Oluşan hücreler ana hücreyle tıpatıp aynıdır. Tek hücrelilerde üremeyi, çok hücrelilerde büyüme, gelişme ve yaraların onarılmasını sağlar. Hayat boyu devam eder.\n2. Mayoz Bölünme: Üreme ana hücrelerinde (yumurta ana, sperm ana hücresi) görülür. Bölünme sonucu 4 yeni hücre oluşur ve kromozom sayısı YARIYA İNER (2n kromozom n kromozoma düşer). Bölünme sırasında gerçekleşen 'Parça Değişimi (Krossing-over)' sayesinde oluşan hücreler birbirinden ve ata canlıdan farklı olur, yani çeşitlilik sağlar. Ergenlikle başlar, üreme döneminin bitişiyle son bulur.",
        
        "kuvvet ve enerji": "☄️ [7. Sınıf Fen Bilimleri - Kuvvet, İş ve Enerji]\n\nFiziksel anlamda bir İŞ yapılabilmesi için cismin uygulanan kuvvet doğrultusunda hareket etmesi gerekir. (Örn: Duvarı iten ama hareket ettiremeyen çocuk fiziksel anlamda iş yapmaz. Sırt çantasıyla düz yolda yürüyen çocuk iş yapmaz çünkü kuvvet yukarı, hareket ileri doğrudur).\nEnerji ise iş yapabilme yeteneğidir:\n- Kinetik Enerji: Cismin süratinden ve kütlesinden dolayı sahip olduğu enerjidir. (Hız ve kütle artarsa kinetik enerji artar).\n- Potansiyel Enerji: Cismin konumundan, yüksekliğinden veya esnekliğinden dolayı depoladığı enerjidir. (Yükseklik arttıkça çekim potansiyel enerjisi artar).\n⚠️ Enerjinin Korunumu: Enerji yoktan var olmaz, vardan yok olmaz; sadece kinetikten potansiyele ya da potansiyelden kinetiğe dönüşür.",
        
        "saf maddeler": "🧪 [7. Sınıf Fen Bilimleri - Saf Maddeler ve Karışımlar]\n\nMaddeler atomik yapılarına göre sınıflara ayrılır:\n1. Elementler: Aynı cins atomlardan oluşan saf maddelerdir. Fiziksel veya kimyasal yollarla ayrıştırılamazlar. Sembollerle gösterilirler (Örn: Hidrojen [H], Helyum [He], Demir [Fe]).\n2. Bileşikler: En az iki farklı elementin kendi özelliklerini kaybederek, belirli oranlarda kimyasal olarak birleşmesiyle oluşan saf maddelerdir. Formüllerle gösterilirler (Örn: Su [H2O], Karbondioksit [CO2], Tuz [NaCl]).\n- Karışımlar: En az iki farklı maddenin kimyasal bağ oluşturmadan, rastgele oranlarda bir araya gelmesiyle oluşan saf olmayan maddelerdir. Homojen (çözeltiler, örn: tuzlu su) ve Heterojen (örn: zeytinyağı-su, salata) olarak ikiye ayrılırlar. Fiziksel yöntemlerle (buharlaştırma, damıtma, yoğunluk farkı) ayrıştırılabilirler.",

        // --- TÜRKÇE DERSİ ---
        "fiiller": "✍️ [7. Sınıf Türkçe - Fiillerde Anlam ve Yapı]\n\nFiiller (eylemler), iş, oluş veya durum bildiren kelimelerdir. Anlamlarına göre fiiller üçe ayrılır:\n1. İş (Kılış) Fiilleri: Öznenin kendi isteğiyle yaptığı ve bir nesneyi etkilediği fiillerdir. Kelimenin başına 'onu' getirdiğinde anlamlı olur. (Örn: Onu okudu, onu kırdı, onu yazdı).\n2. Durum Fiilleri: Öznenin içinde bulunduğu durumu bildirir, nesne alamaz. Başına 'onu' gelince anlamsız olur. (Örn: Onu güldü [anlamsız], onu uyudu, onu ağladı).\n3. Oluş Fiilleri: Öznenin iradesi dışında, zamanla kendiliğinden gerçekleşen doğa olayları veya biyolojik değişimlerdir. (Örn: Sararmak, paslanmak, yaşlanmak, büyümek).\n⚠️ Fiil Kipleri: Haber kipleri (zaman bildirir: şimdiki, gelecek, geçmiş, geniş zaman) ve Dilek kipleri (zaman bildirmez, tasarı bildirir: gereklilik, şart, istek, emir) olmak üzere ikiye ayrılır.",
        
        "zarflar": "🏃‍♂️ [7. Sınıf Türkçe - Zarflar (Belirteçler)]\n\nFiillerin, fiilimsilerin, sıfatların veya kendi türünden kelimelerin anlamını zaman, durum, miktar, yer-yön ya da soru yönünden etkileyen sözcüklerdir. Fiile sorulan sorulara göre türleri belirlenir:\n- Durum Zarfı: Fiile sorulan 'Nasıl?' sorusunun cevabıdır. (Örn: Koşarak geldi -> Nasıl geldi? Koşarak).\n- Zaman Zarfı: Fiile sorulan 'Ne zaman?' sorusunun cevabıdır. (Örn: Dün akşam aradı -> Ne zaman aradı? Dün akşam).\n- Miktar (Azlık-Çokluk) Zarfı: Fiile veya sıfata sorulan 'Ne kadar?' sorusunun cevabıdır. (Örn: Çok konuştu, en güzel kitap).\n- Yer-Yön Zarfı: Fiile sorulan 'Nereye?' sorusunun cevabıdır. (Aşağı, yukarı, içeri, dışarı, ileri, geri). ⚠️ Dikkat: Bu kelimeler ek alırsa isim olur! (Örn: 'İçeri girdi' zarftır, 'İçeriye girdi' isimdir).\n- Soru Zarfı: Eylemin anlamını soru yoluyla sağlayan kelimelerdir. (Nasıl, ne zaman, niçin, neden, ne kadar).",

        // --- SOSYAL BİLGİLER DERSİ ---
        "iletişim": "🗣️ [7. Sınıf Sosyal Bilgiler - İletişim ve İnsan İlişkileri]\n\nİletişim, duygu, düşünce veya bilgilerin her türlü yolla başkalarına aktarılması sürecidir. İletişimi olumlu etkileyen en önemli güçler 'Empati kurmak' (kendini başkasının yerine koymak), 'Etkin dinlemek' ve yapıcı olan 'Ben Dili'ni kullanmaktır. (Örn: 'Ders çalışmadığında senin için endişeleniyorum' $\rightarrow$ Ben dili). İletişimi koparan hatalar ise yargılamak, lakap takmak, suçlayıcı 'Sen Dili' kullanmak ve ön yargılı olmaktır. Ayrıca bu ünitede kitle iletişim özgürlüğü, sansür (yayın yasağı) ve RTÜK (Radyo ve Televizyon Üst Kurulu) gibi kavramlar işlenir.",
        
        "osmanlı devleti": "🏰 [7. Sınıf Sosyal Bilgiler - Türk Tarihinde Yolculuk / Osmanlı Dönemi]\n\n1299 yılında Söğüt ve Domaniç civarında Osman Bey tarafından kurulan küçük bir beyliğin kısa sürede bir dünya imparatorluğuna dönüşme sürecidir. Osmanlı'nın kısa sürede büyümesinin ana nedenleri:\n1. Coğrafi Konum (Jeopolitik): Bizans sınırında kurulması ve uç beyliği olması.\n2. İstimalet Politikası: Fethedilen yerlerdeki gayrimüslim halka uygulanan hoşgörü ve adalet yönetimi.\n3. İskan Politikası: Fethedilen Balkan topraklarına Anadolu'daki Türkmen göçebe nüfusun yerleştirilerek bölgenin kalıcı olarak Türkleştirilmesi.\n4. Gaza ve Cihat Anlayışı: Din uğruna yapılan savaşların getirdiği büyük motivasyon.\nBu ünitede ayrıca Orhan Bey dönemi (devletleşme), İstanbul'un Fethi (Coğrafi keşiflerin tetiklenmesi) ve Osmanlı toplum yapısı detaylıca incelenir.",

    // Harf tolerans algoritması
    function getSimilarityScore(str1, str2) {
        const track = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));
        for (let i = 0; i <= str1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= str2.length; j += 1) track[j][0] = j;
        for (let j = 1; j <= str2.length; j += 1) {
            for (let i = 1; i <= str1.length; i += 1) {
                const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        return track[str2.length][str1.length];
    }

    // Gelişmiş, Doğal ve Net Yanıt Motoru
    function akilliCevapMotoru(cumle) {
        const temizCumle = cumle.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
        const kelimeler = temizCumle.split(" ");
        let bulunanAnlamlar = [];
        let yakalananKelimeler = [];

        // ÖNCE SÖZLÜKTE ARAMA YAP (Eksik/Hatalı Harf Kontrolü Dahil)
        for (let kelime of kelimeler) {
            if (kelime.length < 3) continue;

            let enYakinKelime = "";
            let enDusukMesafe = 3; 

            for (let sozlukKelimesi in OZEL_SOZLUK) {
                let mesafe = getSimilarityScore(kelime, sozlukKelimesi);
                if (mesafe < enDusukMesafe) {
                    enDusukMesafe = mesafe;
                    enYakinKelime = sozlukKelimesi;
                }
            }

            if (enYakinKelime) {
                bulunanAnlamlar.push(OZEL_SOZLUK[enYakinKelime]);
                yakalananKelimeler.push(enYakinKelime.toUpperCase());
            }
        }

        // Eğer sözlükten kelimeler eşleştiyse, doğrudan net açıklamayı getir
        if (bulunanAnlamlar.length > 0) {
            let baslik = yakalananKelimeler.join(" ve ");
            return `🔍 [${baslik}] analizi:\n` + bulunanAnlamlar.join("\n\n");
        }

        // SÖZLÜK DIŞI DOĞAL SORU KALIPLARI (Rastgele Cümle Çeşitliliğiyle)
        if (temizCumle.includes("nasil basarili") || temizCumle.includes("nasil basarili olurum") || temizCumle.includes("basari yolu")) {
            const basariCevaplari = [
                "Başarılı olmak net bir hedef belirlemek, her gün taviz vermeden disiplinli çalışmak ve başarısızlıklardan ders çıkarmakla mümkündür. Çok çalışmak bu işin anahtarıdır.",
                "Sürekli ve odaklanmış çalışarak başarılı olursun. Rotanı çiz, dikkatini dağıtan şeyleri hayatından çıkar ve pes etmeden devam et.",
                "Başarının formülü basittir: Doğru strateji, çok çalışmak ve süreklilik. Ertelemeyi bıraktığın gün başarın katlanacaktır."
            ];
            return basariCevaplari[Math.floor(Math.random() * basariCevaplari.length)];
        }

        if (temizCumle.includes("ne yapiyorsun") || temizCumle.includes("ne is yaparsin")) {
            return "Şu an senin girdilerini analiz ediyorum, kod tabanımı stabil tutmaya çalışıyorum.";
        }

        if (temizCumle.includes("kimsin") || temizCumle.includes("adin ne")) {
            return "Ben İman Power Zeka. Tek bir index.html dosyasında yaşayan, sözlüğe ve kurallara dayalı akıllı bir asistanım.";
        }

        // HİÇBİR ŞEY BULAMAZSA DÜZ VE GERÇEKÇİ YANIT VER (Saçma Hemfikirlik Yok)
        const standartCevaplar = [
            `"${cumle}" ifadesini analiz ettim. Bu kelimeler şu anki bilgi haznemde veya sözlüğümde doğrudan kayıtlı değil. İleride buraya yeni mantıksal kurallar ekleyebilirsin.`,
            `Girdiğin "${cumle}" mesajına dair net bir eşleşme bulamadım. Kod bloğundaki kuralları geliştirerek beni daha akıllı yapabilirsin.`,
            `Anladım, fakat "${cumle}" sorusu hakkında henüz eğitilmedim. Kodun içerisine bu soru için yeni bir kalıp eklememizi ister misin?`
        ];
        return standartCevaplar[Math.floor(Math.random() * standartCevaplar.length)];
    }

    // EKRAN VE FIREBASE SİSTEMİ
    window.switchScreen = function(screenId) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('register-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'none';
        
        const container = document.getElementById('main-container');
        if(screenId === 'chat-screen') {
            document.getElementById(screenId).style.display = 'flex';
            container.style.maxWidth = "600px";
        } else {
            document.getElementById(screenId).style.display = 'block';
            container.style.maxWidth = "480px";
        }
    }

    window.register = function() {
        const user = document.getElementById('reg-username').value.trim().toLowerCase();
        const pass = document.getElementById('reg-password').value;
        if(!user || !pass) return alert("Boş alan bırakmayalım lütfen!");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists()) {
                alert("Bu kullanıcı adı alınmış.");
            } else {
                set(ref(db, 'users/' + user), { password: pass, chatHistory: "" }).then(() => {
                    alert("Profil başarıyla oluşturuldu.");
                    switchScreen('login-screen');
                });
            }
        });
    }

    window.login = function() {
        const user = document.getElementById('login-username').value.trim().toLowerCase();
        const pass = document.getElementById('login-password').value;
        if(!user || !pass) return alert("Lütfen bilgileri girin.");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val().password === pass) {
                currentUsername = user;
                document.getElementById('welcome-user').innerText = `⚡ ${user.toUpperCase()}`;
                switchScreen('chat-screen');
                loadChatHistory();
            } else {
                alert("Hatalı giriş.");
            }
        });
    }

    function loadChatHistory() {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = "";
        const dbRef = ref(db);
        get(child(dbRef, `users/${currentUsername}/chatHistory`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val() !== "") {
                const history = JSON.parse(snapshot.val());
                history.forEach(msg => appendMessage(msg.text, msg.sender));
            } else {
                appendMessage("Sistem Aktif. Sorularınızı veya sözlükteki kelimeleri yazabilirsiniz. Yanlış yazımları otomatik algılarım.", "ai");
            }
        });
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg');
        msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.sendMessage = function() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;

        appendMessage(text, 'user');
        input.value = "";

        setTimeout(() => {
            // Yeni akıllı ve gerçekçi cevap motorunu tetikliyoruz
            let yapayZekaCevabi = akilliCevapMotoru(text);

            appendMessage(yapayZekaCevabi, 'ai');
            saveCurrentChat();
        }, 550);
    }

    function saveCurrentChat() {
        const chatBox = document.getElementById('chat-box');
        const messages = [];
        chatBox.querySelectorAll('.msg').forEach(msgDiv => {
            const sender = msgDiv.classList.contains('user-msg') ? 'user' : 'ai';
            messages.push({ text: msgDiv.innerText, sender: sender });
        });
        set(ref(db, `users/${currentUsername}/chatHistory`), JSON.stringify(messages));
    }

    window.logout = function() {
        currentUsername = "";
        switchScreen('login-screen');
    }
</script>
