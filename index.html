<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power FC | 7/24 Canlı Destek Merkezi</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <script type="text/javascript" src=\"https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js\"></script>
    <style>
        :root {
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.95);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.5);
            --text: #f8fafc;
            --border: rgba(16, 185, 129, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- GİRİŞ EKRANI --- */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .auth-card { background: var(--glass); padding: 40px; border-radius: 30px; border: 2px solid var(--accent); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 40px var(--accent-glow); }
        .auth-card img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 20px; }

        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #1e293b; background: #0f172a; color: white; font-size: 1rem; }
        .btn { padding: 14px; border: none; border-radius: 10px; color: white; font-weight: 800; cursor: pointer; background: var(--accent); width: 100%; transition: 0.3s; text-transform: uppercase; font-size: 1rem; }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--accent-glow); }

        /* --- ANA DESTEK PANELİ DÜZENİ --- */
        header { background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo-box { display: flex; align-items: center; gap: 10px; font-family: 'Orbitron'; font-weight: 900; color: var(--accent); }
        .logo-box img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent); }

        .main-container { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* SOL TARAF: TICKET LİSTESİ VE FORM */
        .sidebar { width: 350px; border-right: 1px solid var(--border); background: rgba(15, 23, 42, 0.4); display: flex; flex-direction: column; }
        .ticket-form-box { padding: 20px; border-bottom: 1px solid var(--border); background: rgba(2, 6, 23, 0.5); }
        .ticket-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .ticket-item { background: var(--glass); padding: 15px; border-radius: 15px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; position: relative; }
        .ticket-item:hover, .ticket-item.active { border-color: var(--accent); background: rgba(16, 185, 129, 0.05); }
        .ticket-item .delete-btn { position: absolute; top: 12px; right: 12px; background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; cursor: pointer; display: none; }

        /* SAĞ TARAF: SOHBET ODASI */
        .chat-container { flex: 1; display: flex; flex-direction: column; background: #070f24; position: relative; }
        .chat-header { padding: 20px; background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid var(--border); font-family: 'Orbitron'; font-weight: 900; color: var(--accent); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg-row { display: flex; width: 100%; }
        .msg-row.user-msg { justify-content: flex-end; }
        .msg-row.admin-msg { justify-content: flex-start; }
        
        .msg-bubble { max-width: 70%; padding: 12px 18px; border-radius: 20px; line-height: 1.5; font-size: 0.95rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }
        .msg-row.user-msg .msg-bubble { background: var(--accent); color: #000; border-bottom-right-radius: 4px; font-weight: 600; }
        .msg-row.admin-msg .msg-bubble { background: #1e293b; color: #f8fafc; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        
        .msg-info { font-size: 0.68rem; margin-top: 5px; opacity: 0.6; display: block; text-align: right; }
        .msg-row.admin-msg .msg-info { text-align: left; color: #94a3b8; }

        .chat-input-area { padding: 20px; background: rgba(2, 6, 23, 0.8); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
        
        /* ADMİN GİRİŞ KİLİDİ BUTONU */
        .admin-lock-badge { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; font-weight: 600; color: #64748b; }
        .admin-lock-badge:hover { color: #ef4444; border-color: #ef4444; }

        /* MOBİL RESPONSIVE DÜZEN */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: 260px; border-right: none; border-bottom: 2px solid var(--border); }
            .ticket-form-box { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .ticket-form-box input, .ticket-form-box button { margin-bottom: 0; padding: 10px; font-size: 0.85rem; }
            .ticket-form-box button { grid-column: span 2; }
            .chat-header { padding: 12px; font-size: 0.9rem; }
            .chat-messages { padding: 15px; }
            .msg-bubble { max-width: 85%; font-size: 0.88rem; padding: 10px 14px; }
            .chat-input-area { padding: 12px; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <img src="logo.png" alt="Logo" onerror="this.src='https://0imanpower0.github.io/ImanPower1/logo.png'">
            <h2 id="auth-title" style="margin-bottom:20px; font-family:'Orbitron'; color:var(--accent); letter-spacing: 2px;">DESTEK GİRİŞİ</h2>
            <input type="text" id="u-in" placeholder="Kullanıcı Adı">
            <input type="password" id="p-in" placeholder="Şifre">
            <button class="btn" id="auth-btn" onclick="handleAuth()">GİRİŞ YAP / KAYIT OL</button>
            <p style="margin-top:15px; font-size:0.75rem; color:#64748b;">Hesabınız yoksa otomatik oluşturulur.</p>
        </div>
    </div>

    <header>
        <div class="logo-box">
            <img src="logo.png" onerror="this.src='https://0imanpower0.github.io/ImanPower1/logo.png'">
            <span>İMAN POWER DESTEK</span>
        </div>
        <div id="adm-badge-area" class="admin-lock-badge" onclick="promptAdminKey()">🔒 YETKİLİ GİRİŞİ</div>
    </header>

    <div class="main-container">
        
        <div class="sidebar">
            <div class="ticket-form-box">
                <h4 style="font-family:'Orbitron'; font-size:0.8rem; color:var(--accent); margin-bottom:10px; letter-spacing:1px;">YENİ DESTEK ODASI</h4>
                <input type="text" id="tk-name" placeholder="Adınız Soyadınız">
                <input type="email" id="tk-email" placeholder="E-posta Adresiniz">
                <button class="btn" style="padding:10px; font-size:0.85rem;" onclick="createNewTicket()">DESTEK ODASI AÇ</button>
            </div>
            <div id="support-tickets-container" class="ticket-list">
                </div>
        </div>

        <div class="chat-container">
            <div id="active-chat-header" class="chat-header">🎧 LÜTFEN BİR DESTEK ODASI SEÇİN VEYA YENİ BİR ODA AÇIN</div>
            <div id="chat-messages-box" class="chat-messages">
                </div>
            <div class="chat-input-area">
                <input type="text" id="chat-msg-input" placeholder="Mesajınızı buraya yazın..." style="margin:0;" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button class="btn" style="width:120px; padding:12px;" onclick="sendChatMessage()">GÖNDER</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // EmailJS Kurulumu
        emailjs.init("VlXfX0xIInWfT587I");

        const firebaseConfig = {
            apiKey: "AIzaSyDy4ZUv_wZsntWSIDbcOlvpqDTBvWuSdrk",
            authDomain: "imanpowerveri.firebaseapp.com",
            databaseURL: "https://imanpowerveri-default-rtdb.firebaseio.com",
            projectId: "imanpowerveri",
            storageBucket: "imanpowerveri.firebasestorage.app",
            messagingSenderId: "891464029314",
            appId: "1:891464029314:web:581bd3b2ed3d7c6af2d09b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let user = "";
        let isLiveSupportAdmin = false;
        let activeTicketId = null;
        let activeChatListener = null;

        // AUTH ENGINE
        window.handleAuth = () => {
            const username = document.getElementById('u-in').value.trim().toLowerCase();
            const password = document.getElementById('p-in').value;
            if(!username || !password) return alert("Kullanıcı adı ve şifre zorunlu!");

            onValue(ref(db, 'users/' + username), (snap) => {
                if(snap.exists()) {
                    if(snap.val().password === password) {
                        loginSuccess(username);
                    } else {
                        alert("Hatalı şifre!");
                    }
                } else {
                    set(ref(db, 'users/' + username), { password: password }).then(() => {
                        loginSuccess(username);
                    });
                }
            }, { onlyOnce: true });
        };

        function loginSuccess(username) {
            user = username;
            document.getElementById('auth-screen').style.display = 'none';
            refreshTicketList();
        }

        // ADMIN ENGINE
        window.promptAdminKey = () => {
            const key = prompt("Yetkili Giriş Şifresini Girin:");
            if(key === "imanpower2026") {
                isLiveSupportAdmin = true;
                document.getElementById('adm-badge-area').innerText = "⚡ YETKİLİ MODU AKTİF";
                document.getElementById('adm-badge-area').style.borderColor = "#10b981";
                document.getElementById('adm-badge-area').style.color = "#10b981";
                alert("Yönetici girişi onaylandı. Tüm odaları görebilir ve silebilirsiniz.");
                refreshTicketList();
            } else {
                alert("Hatalı şifre!");
            }
        };

        // YENİ BENZERSİZ ODA AÇMA MOTORU (TRANSACTION KULLANILARAK GERİ SAYMAYAN SAYAÇ SİSTEMİ)
        window.createNewTicket = () => {
            const name = document.getElementById('tk-name').value.trim();
            const email = document.getElementById('tk-email').value.trim();

            if(!name || !email) return alert("Lütfen adınızı ve e-postanızı doldurun!");

            // Firebase Transaction kullanarak veritabanındaki global sayacı 1 artırıyoruz.
            // Bu sayede eski odalar silinse bile sayaç daima ileri gider, çakışma tamamen önlenir.
            const counterRef = ref(db, 'support_ticket_counter');
            
            runTransaction(counterRef, (currentValue) => {
                // Eğer daha önce hiç sayaç yoksa 1'den başlat, varsa mevcut değeri 1 artır
                return (currentValue || 0) + 1;
            }).then((result) => {
                if (result.committed) {
                    const ticketNumber = result.snapshot.val();
                    const newTicketId = "Destek " + ticketNumber; // Örn: "Destek 9"

                    const ticketPayload = {
                        name: name,
                        email: email,
                        creator: user,
                        timestamp: Date.now()
                    };

                    set(ref(db, 'support_tickets/' + newTicketId), ticketPayload).then(() => {
                        // EmailJS ile adminlere bildirim maili gönderimi
                        emailjs.send("service_ep2or69", "template_uivftia", {
                            ticket_id: newTicketId,
                            user_name: name,
                            user_email: email,
                            reply_to: "imanpowerfc@gmail.com"
                        }).then(() => {
                            console.log("Bildirim maili başarıyla gönderildi.");
                        }).catch((err) => console.log("Mail gönderim hatası:", err));

                        document.getElementById('tk-name').value = "";
                        document.getElementById('tk-email').value = "";
                        
                        // Otomatik olarak yeni açılan odaya geçiş yap
                        selectTicket(newTicketId);
                    });
                }
            }).catch((error) => {
                alert("Oda oluşturulurken bir hata meydana geldi: " + error.message);
            });
        };

        // SEÇİLİ ODANIN SOHBETİNİ YÜKLEME
        window.selectTicket = (ticketId) => {
            activeTicketId = ticketId;
            
            document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('active'));
            const currentItem = document.getElementById(`tk-item-${ticketId}`);
            if(currentItem) currentItem.classList.add('active');

            document.getElementById('active-chat-header').innerText = `💬 ODADASINIZ: ${ticketId.toUpperCase()}`;

            // Eski listener'ı temizle
            if(activeChatListener) { activeChatListener(); }

            const chatRef = ref(db, `support_chats/${ticketId}`);
            activeChatListener = onValue(chatRef, (snap) => {
                const msgBox = document.getElementById('chat-messages-box');
                msgBox.innerHTML = "";
                
                if(snap.exists()) {
                    Object.values(snap.val()).forEach(m => {
                        const isAdmin = m.role === 'admin';
                        const rowClass = isAdmin ? 'admin-msg' : 'user-msg';
                        
                        msgBox.innerHTML += `<div class="msg-row ${rowClass}">
                            <div class="msg-bubble">
                                <b style="font-size:0.75rem; display:block; margin-bottom:2px; color: ${isAdmin ? '#38bdf8' : '#020617'}">${m.sender.toUpperCase()}</b>
                                ${m.message}
                                <span class="msg-info">${m.time}</span>
                            </div>
                        </div>`;
                    });
                    msgBox.scrollTop = msgBox.scrollHeight;
                } else {
                    msgBox.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b; font-size:0.9rem;">Oda başarıyla açıldı. Yetkililerle görüşmek için ilk mesajınızı yazabilirsiniz.</div>`;
                }
            });
        };

        // MESAJ GÖNDERME MOTORU
        window.sendChatMessage = () => {
            const text = document.getElementById('chat-msg-input').value.trim();
            if(!text || !activeTicketId) return;

            const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const newMsgRef = push(ref(db, `support_chats/${activeTicketId}`));
            
            set(newMsgRef, {
                sender: user,
                message: text,
                time: timeString,
                role: isLiveSupportAdmin ? 'admin' : 'user',
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('chat-msg-input').value = "";
            });
        };

        // BİLET SİLME MOTORU (Sadece admin silebilir)
        window.deleteTicket = (ticketId, event) => {
            event.stopPropagation(); // Üzerine tıklayıp odayı seçmesin diye engelle
            if(!isLiveSupportAdmin) return;

            if(confirm(`${ticketId} odasını ve tüm mesaj geçmişini tamamen silmek istiyor musunuz?`)) {
                remove(ref(db, `support_tickets/${ticketId}`)).then(() => {
                    remove(ref(db, `support_chats/${ticketId}`));
                    if(activeTicketId === ticketId) {
                        activeTicketId = null;
                        document.getElementById('chat-messages-box').innerHTML = "";
                        document.getElementById('active-chat-header').innerText = "🎧 LÜTFEN BİR DESTEK ODASI SEÇİN VEYA YENİ BİR ODA AÇIN";
                    }
                    alert("Oda ve geçmiş başarıyla temizlendi.");
                });
            }
        };

        // SOL LİSTEYİ ANLIK GÜNCELLEME SİSTEMİ
        function refreshTicketList() {
            onValue(ref(db, 'support_tickets'), (snap) => {
                const tkContainer = document.getElementById('support-tickets-container');
                tkContainer.innerHTML = "";
                if(snap.exists()) {
                    Object.entries(snap.val()).forEach(([key, val]) => {
                        // Admin değilse ve biletin sahibi kendisi değilse listeleme
                        if(!isLiveSupportAdmin && val.creator !== user) return;

                        tkContainer.innerHTML += `<div class="ticket-item ${activeTicketId === key ? 'active' : ''}\" id="tk-item-${key}" onclick="selectTicket('${key}')">
                            <button class="delete-btn" id="del-btn-${key}" onclick="deleteTicket('${key}', event)">❌ SİL</button>
                            <div style="font-weight:900; color:var(--accent); font-family:'Orbitron'; font-size:0.85rem;">📌 ${key}</div>
                            <div style="font-size:0.75rem; margin-top:4px;">İsim: ${val.name}</div>
                            <div style="font-size:0.65rem; color:#64748b; margin-top:2px;">Gmail: ${val.email}</div>
                        </div>`;

                        // Admin giriş yapmışsa silme butonlarını görünür yap
                        if(isLiveSupportAdmin) {
                            setTimeout(() => {
                                const dBtn = document.getElementById(`del-btn-${key}`);
                                if(dBtn) dBtn.style.display = 'block';
                            }, 50);
                        }
                    });
                }
            });
        }

        refreshTicketList();
    </script>
</body>
</html>
