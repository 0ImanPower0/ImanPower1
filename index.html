<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power Zeka v3</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.75);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --text-color: #f1f5f9;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at center, #1e2640 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(0, 242, 254, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            box-sizing: border-box;
            transition: all 0.4s ease;
        }

        h2 { 
            text-align: center; 
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 15, 26, 0.8);
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--secondary-neon), var(--primary-neon));
            border: none;
            color: #0b0f19;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 12px;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
            cursor: pointer;
        }

        .toggle-link span { color: var(--primary-neon); font-weight: 600; }
        
        #chat-screen { display: none; height: 82vh; flex-direction: column; }
        
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            background: rgba(10, 15, 26, 0.6);
            margin-bottom: 15px;
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.2); border-radius: 10px; }

        .msg { 
            margin: 12px 0; 
            padding: 12px 16px; 
            border-radius: 16px; 
            max-width: 85%; 
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word; 
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg { 
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            margin-left: auto; 
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ai-msg { 
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.05)); 
            margin-right: auto; 
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0, 242, 254, 0.15);
        }

        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { margin: 0; }
        .chat-input-area button { margin: 0; width: auto; padding: 0 24px; }
        
        .header-area { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }
        
        .logout-btn { 
            background: linear-gradient(135deg, #ff416c, #ff4b2b); 
            color: white;
            padding: 6px 14px; 
            font-size: 13px; 
            width: auto; 
            margin: 0;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="login-screen">
        <h2>İman Power Zeka</h2>
        <p style="text-align: center; color: #64748b; font-size: 14px; margin-top: -8px;">Geleceğin Akıllı Bilgi Sistemi</p>
        <input type="text" id="login-username" placeholder="Kullanıcı Adı">
        <input type="password" id="login-password" placeholder="Şifre">
        <button onclick="login()">Sisteme Giriş Yap</button>
        <div class="toggle-link" onclick="switchScreen('register-screen')">Aramıza katılmak ister misin? <span>Kayıt Ol</span></div>
    </div>

    <div id="register-screen" style="display: none;">
        <h2>Yeni Profil Oluştur</h2>
        <p style="text-align: center; color: #64748b; font-size: 14px; margin-top: -8px;">Verilerin Güvenle Saklanacak</p>
        <input type="text" id="reg-username" placeholder="Kullanıcı Adı Belirle">
        <input type="password" id="reg-password" placeholder="Güçlü Bir Şifre">
        <button onclick="register()">Hesabı Oluştur</button>
        <div class="toggle-link" onclick="switchScreen('login-screen')">Zaten bir hesabın var mı? <span>Giriş Yap</span></div>
    </div>

    <div id="chat-screen">
        <div class="header-area">
            <h3 style="margin:0; font-size: 16px; color: var(--primary-neon);" id="welcome-user">Kullanıcı</h3>
            <button class="logout-btn" onclick="logout()">Güvenli Çıkış</button>
        </div>
        <div id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Bir şeyler sorun veya kelime yazın..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDy4ZUv_wZsntWSIDbcolvpqDTBvWuSdrk",
        authDomain: "imanpowerveri.firebaseapp.com",
        databaseURL: "https://imanpowerveri-default-rtdb.firebaseio.com",
        projectId: "imanpowerveri",
        storageBucket: "imanpowerveri.firebasestorage.app",
        messagingSenderId: "891464029314",
        appId: "1:891464029314:web:581bd3b2ed3d7c6af2d09b",
        measurementId: "G-4T6XSDBDL5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let currentUsername = "";

    // ==========================================
    // KELİME SÖZLÜĞÜNÜN KORUNAN BÖLÜMÜ
    // ==========================================
    const OZEL_SOZLUK = {
        "merhaba": "Sana da merhaba! Bugün senin için ne yapabilirim?",
        "selam": "Selam! Hoş geldin, seni dinliyorum.",
        "nasılsın": "Teşekkürler, gayet iyiyim ve çalışmaya hazırım. Sen nasılsın?",
        "naber": "İyilik, kodları koşturuyorum. Senden naber?",
        "teşekkür": "Rica ederim, görevim! Başka bir isteğin var mı?",
        "iman": "İman; inanmak, güvenmek ve samimiyet demektir. Bu projenin özüdür.",
        "zeka": "Zeka, sorunları çözme yeteneğidir. İman Power Zeka ise bu yeteneği geliştirmeyi hedefler.",
        "kodlama": "Kodlama, bilgisayarla konuşma dilidir. Mantıklı komutlar verirsen harikalar yaratırsın.",
        "github": "Projelerini depoladığın, sürüm kontrolü yaptığın ve tüm dünyaya açtığın yazılım kütüphanesidir.",
        "gelecek": "Gelecek, bugün attığın adımlarla şekillenir. Yapay zeka bu geleceğin büyük bir parçası.",
        "firebase": "Verileri anlık olarak kaydeden, kullanıcı yönetimini sağlayan güçlü bir Google altyapısıdır.",
        "başarı": "Başarı; disiplinli olmak, pes etmemek ve çok çalışmakla gelir.",
        "hedef": "Hedef, varmak istediğin noktadır. Doğru bir planlama yoksa hedef sadece bir hayal olarak kalır.",
        "hayat": "Hayat, sürekli bir öğrenme ve deneyimleme sürecidir.",
        "bilgi": "Bilgi, doğru kullanıldığında ve eyleme döküldüğünde en büyük güce dönüşür."
    };

    // Harf tolerans algoritması
    function getSimilarityScore(str1, str2) {
        const track = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));
        for (let i = 0; i <= str1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= str2.length; j += 1) track[j][0] = j;
        for (let j = 1; j <= str2.length; j += 1) {
            for (let i = 1; i <= str1.length; i += 1) {
                const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        return track[str2.length][str1.length];
    }

    // Gelişmiş, Doğal ve Net Yanıt Motoru
    function akilliCevapMotoru(cumle) {
        const temizCumle = cumle.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
        const kelimeler = temizCumle.split(" ");
        let bulunanAnlamlar = [];
        let yakalananKelimeler = [];

        // ÖNCE SÖZLÜKTE ARAMA YAP (Eksik/Hatalı Harf Kontrolü Dahil)
        for (let kelime of kelimeler) {
            if (kelime.length < 3) continue;

            let enYakinKelime = "";
            let enDusukMesafe = 3; 

            for (let sozlukKelimesi in OZEL_SOZLUK) {
                let mesafe = getSimilarityScore(kelime, sozlukKelimesi);
                if (mesafe < enDusukMesafe) {
                    enDusukMesafe = mesafe;
                    enYakinKelime = sozlukKelimesi;
                }
            }

            if (enYakinKelime) {
                bulunanAnlamlar.push(OZEL_SOZLUK[enYakinKelime]);
                yakalananKelimeler.push(enYakinKelime.toUpperCase());
            }
        }

        // Eğer sözlükten kelimeler eşleştiyse, doğrudan net açıklamayı getir
        if (bulunanAnlamlar.length > 0) {
            let baslik = yakalananKelimeler.join(" ve ");
            return `🔍 [${baslik}] analizi:\n` + bulunanAnlamlar.join("\n\n");
        }

        // SÖZLÜK DIŞI DOĞAL SORU KALIPLARI (Rastgele Cümle Çeşitliliğiyle)
        if (temizCumle.includes("nasil basarili") || temizCumle.includes("nasil basarili olurum") || temizCumle.includes("basari yolu")) {
            const basariCevaplari = [
                "Başarılı olmak net bir hedef belirlemek, her gün taviz vermeden disiplinli çalışmak ve başarısızlıklardan ders çıkarmakla mümkündür. Çok çalışmak bu işin anahtarıdır.",
                "Sürekli ve odaklanmış çalışarak başarılı olursun. Rotanı çiz, dikkatini dağıtan şeyleri hayatından çıkar ve pes etmeden devam et.",
                "Başarının formülü basittir: Doğru strateji, çok çalışmak ve süreklilik. Ertelemeyi bıraktığın gün başarın katlanacaktır."
            ];
            return basariCevaplari[Math.floor(Math.random() * basariCevaplari.length)];
        }

        if (temizCumle.includes("ne yapiyorsun") || temizCumle.includes("ne is yaparsin")) {
            return "Şu an senin girdilerini analiz ediyorum, kod tabanımı stabil tutmaya çalışıyorum.";
        }

        if (temizCumle.includes("kimsin") || temizCumle.includes("adin ne")) {
            return "Ben İman Power Zeka. Tek bir index.html dosyasında yaşayan, sözlüğe ve kurallara dayalı akıllı bir asistanım.";
        }

        // HİÇBİR ŞEY BULAMAZSA DÜZ VE GERÇEKÇİ YANIT VER (Saçma Hemfikirlik Yok)
        const standartCevaplar = [
            `"${cumle}" ifadesini analiz ettim. Bu kelimeler şu anki bilgi haznemde veya sözlüğümde doğrudan kayıtlı değil. İleride buraya yeni mantıksal kurallar ekleyebilirsin.`,
            `Girdiğin "${cumle}" mesajına dair net bir eşleşme bulamadım. Kod bloğundaki kuralları geliştirerek beni daha akıllı yapabilirsin.`,
            `Anladım, fakat "${cumle}" sorusu hakkında henüz eğitilmedim. Kodun içerisine bu soru için yeni bir kalıp eklememizi ister misin?`
        ];
        return standartCevaplar[Math.floor(Math.random() * standartCevaplar.length)];
    }

    // EKRAN VE FIREBASE SİSTEMİ
    window.switchScreen = function(screenId) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('register-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'none';
        
        const container = document.getElementById('main-container');
        if(screenId === 'chat-screen') {
            document.getElementById(screenId).style.display = 'flex';
            container.style.maxWidth = "600px";
        } else {
            document.getElementById(screenId).style.display = 'block';
            container.style.maxWidth = "480px";
        }
    }

    window.register = function() {
        const user = document.getElementById('reg-username').value.trim().toLowerCase();
        const pass = document.getElementById('reg-password').value;
        if(!user || !pass) return alert("Boş alan bırakmayalım lütfen!");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists()) {
                alert("Bu kullanıcı adı alınmış.");
            } else {
                set(ref(db, 'users/' + user), { password: pass, chatHistory: "" }).then(() => {
                    alert("Profil başarıyla oluşturuldu.");
                    switchScreen('login-screen');
                });
            }
        });
    }

    window.login = function() {
        const user = document.getElementById('login-username').value.trim().toLowerCase();
        const pass = document.getElementById('login-password').value;
        if(!user || !pass) return alert("Lütfen bilgileri girin.");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val().password === pass) {
                currentUsername = user;
                document.getElementById('welcome-user').innerText = `⚡ ${user.toUpperCase()}`;
                switchScreen('chat-screen');
                loadChatHistory();
            } else {
                alert("Hatalı giriş.");
            }
        });
    }

    function loadChatHistory() {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = "";
        const dbRef = ref(db);
        get(child(dbRef, `users/${currentUsername}/chatHistory`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val() !== "") {
                const history = JSON.parse(snapshot.val());
                history.forEach(msg => appendMessage(msg.text, msg.sender));
            } else {
                appendMessage("Sistem Aktif. Sorularınızı veya sözlükteki kelimeleri yazabilirsiniz. Yanlış yazımları otomatik algılarım.", "ai");
            }
        });
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg');
        msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.sendMessage = function() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;

        appendMessage(text, 'user');
        input.value = "";

        setTimeout(() => {
            // Yeni akıllı ve gerçekçi cevap motorunu tetikliyoruz
            let yapayZekaCevabi = akilliCevapMotoru(text);

            appendMessage(yapayZekaCevabi, 'ai');
            saveCurrentChat();
        }, 550);
    }

    function saveCurrentChat() {
        const chatBox = document.getElementById('chat-box');
        const messages = [];
        chatBox.querySelectorAll('.msg').forEach(msgDiv => {
            const sender = msgDiv.classList.contains('user-msg') ? 'user' : 'ai';
            messages.push({ text: msgDiv.innerText, sender: sender });
        });
        set(ref(db, `users/${currentUsername}/chatHistory`), JSON.stringify(messages));
    }

    window.logout = function() {
        currentUsername = "";
        switchScreen('login-screen');
    }
</script>
</body>
</html>
