<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power Zeka</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #00adb5; margin-top: 0; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2d2d2d;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { background: #007a80; }
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #bbb;
            cursor: pointer;
        }
        .toggle-link span { color: #00adb5; text-decoration: underline; }
        
        #chat-screen { display: none; height: 80vh; flex-direction: column; }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #181818;
            margin-bottom: 10px;
        }
        .msg { margin: 10px 0; padding: 10px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background: #00adb5; margin-left: auto; text-align: right; }
        .ai-msg { background: #333; margin-right: auto; }
        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { margin: 0; }
        .chat-input-area button { margin: 0; width: auto; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logout-btn { background: #ff4444; padding: 5px 10px; font-size: 12px; width: auto; margin: 0; }
        .logout-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

<div class="container">
    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <h2>İman Power Zeka - Giriş</h2>
        <input type="text" id="login-username" placeholder="Kullanıcı Adı">
        <input type="password" id="login-password" placeholder="Şifre">
        <button onclick="login()">Giriş Yap</button>
        <div class="toggle-link" onclick="switchScreen('register-screen')">Hesabın yok mu? <span>Kayıt Ol</span></div>
    </div>

    <!-- KAYIT EKRANI -->
    <div id="register-screen" style="display: none;">
        <h2>İman Power Zeka - Kayıt</h2>
        <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
        <input type="password" id="reg-password" placeholder="Şifre">
        <button onclick="register()">Kayıt Ol</button>
        <div class="toggle-link" onclick="switchScreen('login-screen')">Zaten üye misin? <span>Giriş Yap</span></div>
    </div>

    <!-- SOHBET EKRANI -->
    <div id="chat-screen">
        <div class="header-area">
            <h3 style="margin:0; color:#00adb5;" id="welcome-user">Merhaba</h3>
            <button class="logout-btn" onclick="logout()">Çıkış</button>
        </div>
        <div id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Mesajınızı yazın..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // image_238982.png dosyasındaki Firebase bilgileri entegre edildi
    const firebaseConfig = {
        apiKey: "AIzaSyDy4ZUv_wZsntWSIDbcolvpqDTBvWuSdrk",
        authDomain: "imanpowerveri.firebaseapp.com",
        databaseURL: "https://imanpowerveri-default-rtdb.firebaseio.com",
        projectId: "imanpowerveri",
        storageBucket: "imanpowerveri.firebasestorage.app",
        messagingSenderId: "891464029314",
        appId: "1:891464029314:web:581bd3b2ed3d7c6af2d09b",
        measurementId: "G-4T6XSDBDL5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let currentUsername = "";

    // ==========================================
    // ⭐ İLERİDE KELİME VE ANLAMLARINI EKLEYECEĞİN BÖLÜM (SÖZLÜK) ⭐
    // ==========================================
    const OZEL_SOZLUK = {
        "merhaba": "Sana da merhaba! Ben İman Power Zeka, senin için buradayım.",
        "iman": "İman, kalpten inanmak ve güvenmektir. Bu yapay zekanın temel gücüdür!",
        "nasılsın": "Harikayım! Veritabanım sapasağlam çalışıyor, seni dinliyorum.",
        "kodlama": "Yazılım geliştirmek bir sanattır. index.html ile harikalar yaratıyoruz!",
        "github": "Kodlarımızı sakladığımız ve tüm dünyaya açtığımız harika bir platform.",
        "gelecek": "Gelecek yapay zeka ve İman Power ile çok daha akıllı olacak!"
    };

    // İki kelime arasındaki harf benzerliğini hesaplayan algoritma (Levenshtein Distance)
    function getSimilarityScore(str1, str2) {
        const track = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));
        for (let i = 0; i <= str1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= str2.length; j += 1) track[j][0] = j;
        for (let j = 1; j <= str2.length; j += 1) {
            for (let i = 1; i <= str1.length; i += 1) {
                const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        return track[str2.length][str1.length];
    }

    // Yanlış yazılan kelimeleri tespit edip sözlükle eşleştiren fonksiyon
    function akilliKelimeBulucu(cumle) {
        const kelimeler = cumle.toLowerCase().split(" ");
        let bulunanAnlamlar = [];
        let yakalananKelimeler = [];

        for (let kelime of kelimeler) {
            if (kelime.length < 3) continue; // Çok kısa harfleri es geç

            let enYakinKelime = "";
            let enDusukMesafe = 3; // En fazla 2 harf hatasına izin ver

            // Sözlükteki kelimelerle tek tek karşılaştır
            for (let sozlukKelimesi in OZEL_SOZLUK) {
                let mesafe = getSimilarityScore(kelime, sozlukKelimesi);
                if (mesafe < enDusukMesafe) {
                    enDusukMesafe = mesafe;
                    enYakinKelime = sozlukKelimesi;
                }
            }

            // Eğer yakın bir kelime bulunduysa listeye ekle
            if (enYakinKelime) {
                bulunanAnlamlar.push(OZEL_SOZLUK[enYakinKelime]);
                yakalananKelimeler.push(enYakinKelime.toUpperCase());
            }
        }

        if (bulunanAnlamlar.length > 0) {
            // Kelimeleri yan yana getirip birleştirme alanı
            let baglac = yakalananKelimeler.join(" ve ");
            return `🤔 Sanırım ${baglac} hakkında konuşmak istedin. İşte açıklaması:\n\n` + bulunanAnlamlar.join("\n\n");
        }

        return null;
    }

    // GİRİŞ / SOHBET EKRAN KONTROLLERİ
    window.switchScreen = function(screenId) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('register-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'none';
        if(screenId === 'chat-screen') document.getElementById(screenId).style.display = 'flex';
        else document.getElementById(screenId).style.display = 'block';
    }

    window.register = function() {
        const user = document.getElementById('reg-username').value.trim().toLowerCase();
        const pass = document.getElementById('reg-password').value;
        if(!user || !pass) return alert("Lütfen tüm alanları doldurun!");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists()) {
                alert("Bu kullanıcı adı zaten alınmış!");
            } else {
                set(ref(db, 'users/' + user), { password: pass, chatHistory: "" }).then(() => {
                    alert("Kayıt başarılı! Şimdi Giriş Yapabilirsiniz.");
                    switchScreen('login-screen');
                });
            }
        }).catch(err => alert("Kayıt Hatası: " + err.message + "\nLütfen Firebase kurallarını kontrol edin!"));
    }

    window.login = function() {
        const user = document.getElementById('login-username').value.trim().toLowerCase();
        const pass = document.getElementById('login-password').value;
        if(!user || !pass) return alert("Lütfen tüm alanları doldurun!");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val().password === pass) {
                currentUsername = user;
                document.getElementById('welcome-user').innerText = `Üye: ${user}`;
                switchScreen('chat-screen');
                loadChatHistory();
            } else {
                alert("Hatalı kullanıcı adı veya şifre!");
            }
        }).catch(err => alert("Giriş Hatası: " + err.message + "\nLütfen Firebase kurallarını kontrol edin!"));
    }

    function loadChatHistory() {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = "";
        const dbRef = ref(db);
        get(child(dbRef, `users/${currentUsername}/chatHistory`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val() !== "") {
                const history = JSON.parse(snapshot.val());
                history.forEach(msg => appendMessage(msg.text, msg.sender));
            } else {
                appendMessage("Merhaba! Ben İman Power Zeka. Yanlış yazsanız da sizi anlarım! Bana 'mrehaba', 'gthub' veya 'özel kelimelerinizden' yazarak test edin.", "ai");
            }
        });
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg');
        msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.sendMessage = function() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;

        appendMessage(text, 'user');
        input.value = "";

        setTimeout(() => {
            // Akıllı eşleştiriciyi çalıştır (Yanlış harfleri tolere eder)
            let yapayZekaCevabi = akilliKelimeBulucu(text);

            // Eğer sözlükte yakın bir kelime bulamadıysa standart cevap ver
            if (!yapayZekaCevabi) {
                yapayZekaCevabi = `[İman Power Zeka]: "${text}" kelimelerini yan yana getirdim fakat sözlüğümde tam veya yakın bir karşılık bulamadım. İleride beni geliştirebilirsin!`;
            }

            appendMessage(yapayZekaCevabi, 'ai');
            saveCurrentChat();
        }, 800);
    }

    function saveCurrentChat() {
        const chatBox = document.getElementById('chat-box');
        const messages = [];
        chatBox.querySelectorAll('.msg').forEach(msgDiv => {
            const sender = msgDiv.classList.contains('user-msg') ? 'user' : 'ai';
            messages.push({ text: msgDiv.innerText, sender: sender });
        });
        set(ref(db, `users/${currentUsername}/chatHistory`), JSON.stringify(messages));
    }

    window.logout = function() {
        currentUsername = "";
        switchScreen('login-screen');
    }
</script>
</body>
</html>
