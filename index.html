<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power Zeka v4 - Pro Edition</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.75);
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --text-color: #f1f5f9;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at center, #1e2640 0%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(0, 242, 254, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            box-sizing: border-box;
            transition: all 0.4s ease;
        }

        h2 { 
            text-align: center; 
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(10, 15, 26, 0.8);
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--secondary-neon), var(--primary-neon));
            border: none;
            color: #0b0f19;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 12px;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
            cursor: pointer;
        }

        .toggle-link span { color: var(--primary-neon); font-weight: 600; }
        
        #chat-screen { display: none; height: 82vh; flex-direction: column; }
        
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            background: rgba(10, 15, 26, 0.6);
            margin-bottom: 15px;
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.2); border-radius: 10px; }

        .msg { 
            margin: 12px 0; 
            padding: 12px 16px; 
            border-radius: 16px; 
            max-width: 85%; 
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word; 
            white-space: pre-line;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg { 
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            margin-left: auto; 
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ai-msg { 
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.05)); 
            margin-right: auto; 
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0, 242, 254, 0.15);
        }

        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { margin: 0; }
        .chat-input-area button { margin: 0; width: auto; padding: 0 24px; }
        
        .header-area { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }
        
        .logout-btn { 
            background: linear-gradient(135deg, #ff416c, #ff4b2b); 
            color: white;
            padding: 6px 14px; 
            font-size: 13px; 
            width: auto; 
            margin: 0;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <h2>İman Power Zeka</h2>
        <p style="text-align: center; color: #64748b; font-size: 14px; margin-top: -8px;">Geleceğin Akıllı Bilgi Sistemi</p>
        <input type="text" id="login-username" placeholder="Kullanıcı Adı">
        <input type="password" id="login-password" placeholder="Şifre">
        <button onclick="login()">Sisteme Giriş Yap</button>
        <div class="toggle-link" onclick="switchScreen('register-screen')">Aramıza katılmak ister misin? <span>Kayıt Ol</span></div>
    </div>

    <!-- KAYIT EKRANI -->
    <div id="register-screen" style="display: none;">
        <h2>Yeni Profil Oluştur</h2>
        <p style="text-align: center; color: #64748b; font-size: 14px; margin-top: -8px;">Verilerin Güvenle Saklanacak</p>
        <input type="text" id="reg-username" placeholder="Kullanıcı Adı Belirle">
        <input type="password" id="reg-password" placeholder="Güçlü Bir Şifre">
        <button onclick="register()">Hesabı Oluştur</button>
        <div class="toggle-link" onclick="switchScreen('login-screen')">Zaten bir hesabın var mı? <span>Giriş Yap</span></div>
    </div>

    <!-- SOHBET EKRANI -->
    <div id="chat-screen">
        <div class="header-area">
            <h3 style="margin:0; font-size: 16px; color: var(--primary-neon);" id="welcome-user">Kullanıcı</h3>
            <button class="logout-btn" onclick="logout()">Güvenli Çıkış</button>
        </div>
        <div id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Aynı anda birden çok şey sorun (örn: hücre ve espri)..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>
</div>

    const OZEL_SOZLUK = {
        // --- 7. SINIF MATEMATİK ---
       "tam sayılar": "🔢 [7. Sınıf Matematik - Tam Sayılarla İşlemler]\n\nTam sayılar ($Z$) dünyasında hata yapmamak için şu altın kuralları adın gibi bilmelisin:\n\n1. Toplama ve Çıkarma: Zıt işaretlilerde büyükten küçüğü çıkar, büyüğün işaretini yapıştır! Çıkarma işleminde ise çıkarma eksisini ve önündeki sayının işaretini mutlaka TERSİNE çevirip toplamaya dönüştür: $a - (-b) = a + b$.\n2. Çarpma ve Bölme (Dost/Düşman Kuralı): Aynı işaretliler (+), zıt işaretliler (-) olur.\n3. Üslü Nicelikler: Pozitif sayıların tüm kuvvetleri pozitifken, NEGATİF sayıların çift kuvvetleri POZİTİF (parantez varsa!), tek kuvvetleri ise NEGATİF olur. Dikkat: $-3^2 = -9$ iken $(-3)^2 = +9$'dur! Parantez tuzağına düşme!",
        "rasyonel sayılar": "🧮 [7. Sınıf Matematik - Rasyonel Sayılar ve Ondalık Gösterim]\n\nPayı ve paydası tam sayı olan ($b \\neq 0$ olmak üzere) $a/b$ biçimindeki sayılardır. Sınav Taktikleri:\n\n1. Ondalık Yapma: Paydayı 10, 100 veya 1000 yapmalısın. Yapamıyorsan payı paydaya direkt böl!\n2. Devirli Ondalık Kesir Formülü: $\\frac{\\text{Sayının Tamamı} - \\text{Devretmeyen Kısım}}{\\text{Virgülden Sonra Devreden Kadar 9, Devretmeyen Kadar 0}}$\n3. Sıralama: Paylar eşitse paydası KÜÇÜK olan büyüktür (pasta dilimi mantığı). Paydalar eşitse payı BÜYÜK olan büyüktür. Negatif sayılarda önce pozitif gibi sırala, sonra işareti ve yönü tamamen TERS çevir!",
        "rasyonel sayılarla işlemler": "🎯 [7. Sınıf Matematik - Rasyonel Sayılarda İşlem Taktikleri]\n\nToplama-Çıkarma yapacaksan paydaları eşitlemek FARZDIR! Çarpma yaparken pay ile payı, payda ile paydayı çarp; işlem öncesi mutlaka sadeleştirme ara. Bölme işleminde ise ilk kesri AYNEN YAZ, ikinci kesri TERS ÇEVİR ÇARP!\n⚠️ Çok Adımlı İşlemler (Merdivenli Sorular): Her zaman en ana kesir çizgisinin altındaki veya üstündeki en küçük, en uç işlemden başlayarak adım adım ana çizgiye doğru tırman.",
        "cebirsel ifadeler": "🧬 [7. Sınıf Matematik - Cebirsel İfadeler ve Modelleme]\n\nEn az bir bilinmeyen ($x, y, a$) içeren ifadelerdir. Toplama ve çıkarma yaparken sadece BENZER TERİMLERİ (yani bilinmeyeni ve kuvveti tamamen aynı olanları) kendi arasında toplayıp çıkarabilirsin. Örneğin: $3x + 5 + 2x - 1 = 5x + 4$. Bir doğal sayıyı cebirsel ifadeyle çarparken, sayıyı parantez içindeki her bir terimle TEK TEK dağıtarak çarpmalısın: $3(2x - 4) = 6x - 12$. Sınavlarda kare ve dikdörtgen şeklindeki cebirsel karolarla modelleme soruları çok sevilir!",
        "eşitlik ve denklem": "⚖️ [7. Sınıf Matematik - Denklem Çözme Sanatı]\n\nDenklem çözerken tek bir kutsal amacımız var: Bilinmeyeni ($x$) yalnız bırakmak! Terazi dengesini bozmamak için sol tarafa ne yapıyorsan sağ tarafa da aynısını yapmalısın. Pratik Yol: Bilinenler bir tarafa, bilinmeyenler diğer tarafa toplanır. Bir terim eşitliğin karşı tarafına geçerken mutlaka İŞARET DEĞİŞTİRİR (+ ise -, - ise + olur). En son adımda her iki tarafı da $x$'in önündeki sayıya bölerek sonuca ulaşırsın.",
        "oran orantı": "📊 [7. Sınıf Matematik - Doğru ve Ters Orantı]\n\nİki çokluktan biri artarken diğeri de aynı oranda artıyorsa DOĞRU ORANTI vardır ve veriler karşılıklı bölünür (Çapraz Çarpım yapılır: $a \\cdot d = b \\cdot c$). Biri artarken diğeri aynı oranda azalıyorsa TERS ORANTI vardır ve veriler karşılıklı çarpılır (Yan Yana Çarpım yapılır: $a \\cdot b = c \\cdot d$). Havuz, işçi ve dişli çark soruları her zaman ters orantıdır; unutma!",
        "yüzdeler": "📈 [7. Sınıf Matematik - Yüzde Problemleri ve Kâr-Zarar]\n\nBir sayının %A'sını bulmak için sayıyı $\\frac{A}{100}$ ile çarparız. \n💡 Sınav İpucu: %20 kârlı satış fiyatı diyorsa, malın fiyatını direkt %120 olarak hesapla. %15 indirimli (iskontolu) fiyat diyorsa, malın fiyatını direkt %85 olarak bul. Mağazalardaki 'İndirim üzerinden indirim' sorularında yüzdeleri sakın toplama! Önce ilk indirimi yap, çıkan yeni fiyat üzerinden ikinci indirimi hesapla.",
        "geometri": "📐 [7. Sınıf Matematik - Doğrular ve Açılar]\n\nParalel iki doğrunun bir kesenle yaptığı açılarda harf kuralları hayat kurtarır:\n- Z Kuralı (İç Ters Açılar): Köşelerdeki açılar birbirine eşittir.\n- U Kuralı (Karşı Konumlu Açılar): İç taraftaki iki açının toplamı her zaman $180^\\circ$ yapar.\n- M Kuralı: Sol tarafa bakan açıların toplamı, sağ tarafa bakan açının değerine eşittir.\n- Roket / Kalem Ucu Kuralı: İçerideki 3 açının toplamı $360^\\circ$ eder.",
        "çokgenler": "🔷 [7. Sınıf Matematik - Çokgenler ve Alan Formülleri]\n\n$n$ kenarlı bir dışbükey çokgende:\n- İç açılar toplamı: $(n-2) \\cdot 180^\\circ$\n- Bir köşeden çizilebilecek köşegen sayısı: $n-3$\n- Bir dış açısı (düzgün çokgende): $\\frac{360^\\circ}{n}$\n📐 Alan Formülleri:\n- Eşkenar Dörtgenin Alanı: $\\frac{e \\cdot f}{2}$ (Köşegenlerin çarpımının yarısı) veya $\\text{Taban} \\cdot \\text{Yükseklik}$.\n- Yamuğun Alanı: $\\frac{(\\text{Alt Taban} + \\text{Üst Taban}) \\cdot \\text{Yükseklik}}{2}$.",
        "çember ve daire": "⭕ [7. Sınıf Matematik - Çemberin Çevresi ve Dairenin Alanı]\n\nMerkez açının gördüğü yay, merkez açının kendi ölçüsüne eşittir. $\\pi$ (Pi) sayısına dikkat et!\n- Çemberin Çevresi: $2 \\cdot \\pi \\cdot r$\n- Belirli bir yay parçasının uzunluğu: $2 \\cdot \\pi \\cdot r \\cdot \\frac{\\alpha}{360^\\circ}$\n- Dairenin Alanı: $\\pi \\cdot r^2$\n- Daire Diliminin Alanı: $\\pi \\cdot r^2 \\cdot \\frac{\\alpha}{360^\\circ}$ (Buradaki $\\alpha$ merkez açıdır).",
        "veri analizi": "📊 [7. Sınıf Matematik - Veri Analizi ve İstatistik]\n\nÇizgi grafiki zamana bağlı değişimleri, Sütun grafiği farklı verileri karşılaştırmak için, Daire grafiği ise bir bütünün parçalarını göstermek için en uygundur. \n📈 Merkezi Eğilim ve Yayılım Ölçüleri:\n- Aritmetik Ortalama: Tüm verilerin toplamı / Veri sayısı.\n- Tepe Değer (Mod): En çok tekrar eden veri (Veri yoksa mod olmayabilir).\n- Ortanca (Medyan): Sayıları KÜÇÜKTEN BÜYÜĞE sıraladığında tam ortada kalan sayı. Eğer veri sayısı çift ise ortadaki iki sayının ortalaması alınır.",
        "dogrusal denklemler": "📈 [7. Sınıf Matematik - Koordinat Sistemi ve Doğrusal İlişkiler]\n\nKoordinat sistemi, iki sayı doğrusunun $0$ noktasında dik kesişmesiyle oluşur. Yatay eksen $x$ (apsis), dikey eksen $y$ (ordinat) eksenidir. Noktalar $(x, y)$ şeklinde gösterilir. 1. Bölgede $(+, +)$, 2. Bölgede $(-, +)$, 3. Bölgede $(-,-)$ ve 4. Bölgede $(+, -)$ işaretleri hakimdir. Bağımlı değişken kendi kendine değişemeyen, bağımsız değişkene göre şekil alan değişkendir (Örn: Gidilen yola göre depoda kalan yakıt miktarı).",
        
        // --- 7. SINIF FEN BİLİMLERİ ---
        "uzay araştırmaları": "🚀 [7. Sınıf Fen Bilimleri - Uzay Araştırmaları]\n\nUzay istasyonları, uzay mekikleri, roketler ve teleskoplar bu konunun temelidir. Unutma: İşlevi bitmiş yapay uydular ve roket tankları uzay kirliliğine neden olurken, meteorlar ve yıldızlar gibi doğal gök cismleri kirlilik oluşturmaz.",
        "hücre": "🔬 [7. Sınıf Fen Bilimleri - Hücre]\n\nHücre canlıların en küçük yapı taşıdır. Bitki hücresi köşelidir ve hücre duvarı vardır. Hayvan hücresi ise yuvarlaktır, hücre duvarı bulunmaz.",
        "bölünmeler": "🔄 [7. Sınıf Fen Bilimleri - Mitoz ve Mayoz Bölünme]\n\nMitoz bölünme vücut hücrelerinde görülür, kalıtsal çeşitlilik sağlamaz, yaraların onarılmasını sağlar. Mayoz bölünme ise üreme ana hücrelerinde görülür, parça değişimi (krossing-over) sayesinde kalıtsal çeşitlilik sağlar.",
        "kuvvet ve enerji": "☄️ [7. Sınıf Fen Bilimleri - Kuvvet, İş ve Enerji]\n\nFiziksel anlamda iş yapılması için cismin uygulanan kuvvet yönünde hareket etmesi gerekir. Kinetik herji sürat ve kütleye, potansiyel enerji ise yüksekliğe bağlıdır.",
        "saf maddeler": "🧪 [7. Sınıf Fen Bilimleri - Saf Maddeler ve Karışımlar]\n\nElementler sembollerle, bileşikler ise formüllerle gösterilen saf maddelerdir. Karışımlar ise saf değildir, fiziksel yollarla ayrıştırılabilirler.",
        "ışığın soğurulması": "🌈 [7. Sınıf Fen Bilimleri - Işığın Soğurulması]\n\nIşığın maddeler tarafından tutulmasına soğurulma denir. Koyu renkli cisimler ışığı çok soğurur ve ısınır (bu yüzden kışın koyu giyiniriz), açık renkli cisimler ise ışığı yansıtır. Beyaz ışık tüm renklerin birleşimidir.",
        "aynalar": "🪞 [7. Sınıf Fen Bilimleri - Aynalar ve Yansıma]\n\nAynalar düz, çukur ve tümsek olmak üzere üçe ayrılır. Düz aynada görüntü simetriktir. Çukur ayna ışığı toplar ve büyütebilir (dişçi aynası). Tümsek ayna ise ışığı dağıtır, çok geniş bir alanı gösterir (araba aynası).",
        "ekosistem": "🌱 [7. Sınıf Fen Bilimleri - Canlılar ve Çevre]\n\nBelirli bir alanda yaşayan canlılar (biyotik) ile cansız çevrelerin (abiyotik: su, hava, toprak) oluşturduğu bütüne ekosistem denir. Bu ünitede biyoçeşitlilik ve çevre kirliliğini önleme yolları incelenir.",

        // --- 7. SINIF TÜRKÇE ---
       "fiiller": "✍️ [7. Sınıf Türkçe - Anlamlarına Göre Fiiller]\n\nFiiller anlamlarına göre üçe ayrılır ve sınavlarda 'Hangisi farklıdır?' diye sorulur:\n\n1. İş (Kılış) Fiilleri: Nesne alabilen fiillerdir. Pratik Hile: Fiilin başına 'onu' kelimesini getirdiğinde anlamlı oluyorsa iş fiilidir. (Örn: Onu okudu, onu yazdı, onu kırdı ✅).\n2. Durum Fiilleri: Nesne alamayan, insan iradesiyle yapılan anlık durumları bildirir. Pratik Hile: Başına 'onu' gelmez! (Örn: Onu güldü ❌, onu ağladı ❌, onu uyudu ❌).\n3. Oluş Fiilleri: İnsan iradesi dışında, zamanla kendiliğinden gerçekleşen doğa olayları ve biyolojik değişimlerdir. (Örn: Paslanmak, yaşlanmak, sararmak, büyümek).",
        "fiilde kip": "⏰ [7. Sınıf Türkçe - Fiilde Kip, Zaman ve Anlam Kayması]\n\nFiil kipleri Haber (Bildirme) ve Dilek (Tasarlama) olmak üzere ikiye ayrılır:\n📌 Haber Kipleri (Zaman bildirir): Bilinen Geçmiş Zaman (-dı/-di), Öğrenilen Geçmiş Zaman (-mış/-miş), Şimdiki Zaman (-yor / -mekte), Gelecek Zaman (-ecek/-acak), Geniş Zaman (-r/-ar/-er).\n📌 Dilek Kipleri (Zaman bildirmez!): Gereklilik (-meli/-malı), Şart (-se/-sa), İstek (-e/-a -> Örn: Gideyim), Emir (Eki yok!).\n⚠️ Anlam (Kip) Kayması Tuzağı: Bir kip ekinin kendi anlamı dışında başka bir zaman yerine kullanılmasıdır. Örn: 'Yarın Ankara'ya gidiyorum.' (Şimdiki zaman eki, Gelecek zaman yerine kullanılmış). Bu bir anlatım bozukluğu DEĞİLDİR, dilin zenginliğidir!",
        "fiilde yapı": "🏗️ [7. Sınıf Türkçe - Fiilde Yapı: Basit, Türemiş, Birleşik]\n\nEn çok soru gelen ve en çok karıştırılan ünite burasıdır! Dikkatle incele:\n\n1. Basit Fiil: Yapım eki almamış, kök halinde veya sadece çekim eki (zaman/şahıs ekin) almış fiildir. Örn: 'Gel-di-ler' (Basit).\n2. Türemiş Fiil: En az bir tane yapım eki alarak anlamı değişmiş fiildir. Örn: 'Göz'den 'göz-le-mek', 'su'dan 'su-la-mak', 'yaz'dan 'yaz-dır-mak'.\n3. Birleşik Fiil: En az iki kelimenin birleşmesiyle oluşur. 3 türü vardır:\n   • Anlamca Kaynaşmış: Deyimlerdir! (Örn: Göze girmek, kulak kabartmak).\n   • Yardımcı Fiille Kurulan: İsim + etmek, olmak, eylemek, kılmak. Örn: 'Teşekkür etti', 'yardım eyledi'. (⚠️ Tuzağa Dikkat: 'Hissetti', 'kayboldu' gibi ses olayı olanlar bitişik yazılır!).\n   • Kurallı Birleşik: Tezlik (-iver: gidiver), Yeterlilik (-ebil: yapabil), Süreklilik (-edur, -ekal: bakakal, gidedur), Yaklaşma (-eyaz: düşeyazdı).",
        "zarflar": "🏃‍♂️ [7. Sınıf Türkçe - Zarflar (Belirteçler)]\n\nZarflar; fiilleri, fiilimsileri, sıfatları ya da kendi türünden sözcükleri yönünden etkileyen kelimelerdir. Fiile doğru soruyu sormak hayat kurtarır:\n- Durum Zarfı: Fiile sorulan 'NASIL?' sorusunun cevabıdır. (Örn: Hızlı koştu).\n- Zaman Zarfı: Fiile sorulan 'NE ZAMAN?' sorusunun cevabıdır. (Örn: Dün geldik).\n- Miktar (Azlık-Çokluk) Zarfı: Fiile veya sıfata sorulan 'NE KADAR?' sorusunun cevabıdır. (Örn: Çok çalıştı, 'en' ve 'daha' kelimeleri üstünlük zarfıdır).\n- Yer-Yön Zarfı: Fiile sorulan 'NERE(YE)?' sorusunun cevabıdır. (Aşağı, yukarı, içeri, dışarı, ileri, geri).\n🚨 ALTIN KURAL TUZAĞI: Yer-yön kelimeleri ASLA ek almamalıdır! 'Aşağı indi' zarftır ama 'Aşağıya indi' dersen ismin yönelme hal ekini aldığı için İSİM olur. Sınavda buradan çok can yakarlar!",
        "sözcükte anlam": "📖 [7. Sınıf Türkçe - Kelime Anlamı ve Söz Öbekleri]\n\n- Gerçek Anlam: Kelimenin aklımıza gelen ilk ve temel anlamıdır. (Örn: Ağzında 'diş' çıktı).\n- Mecaz Anlam: Kelimenin gerçek anlamından tamamen sıyrılarak kazandığı soyut, yeni anlamdır. (Örn: Bu işte onun da 'parmağı' var).\n- Terim Anlam: Bilim, sanat, spor veya meslek dallarına ait özel kavramlardır. (Örn: Nota, penaltı, kafiye, meridyen, hücre, açılar).\n🎯 Söz Sanatları (Edebi Sanatlar): Kişileştirme (İnsan dışı varlığa insan özelliği verme), Konuşturma (İnsan dışı varlığı konuşturma), Benzetme (Zayıfı güçlüye benzetme), Tezat (Zıtlık), Mübalağa (Abartma).",
        "cümlede anlam": "💬 [7. Sınıf Türkçe - Cümleler Arası Anlam İlişkileri]\n\n- Öznel Cümle: Kişisel görüş içerir, kanıtlanamaz. (Örn: En güzel renk mavidir).\n- Nesnel Cümle: Kişisel görüş içermez, herkesçe kabul edilir, kanıtlanabilir. (Örn: Türkiye'nin başkenti Ankara'dır).\n- Neden-Sonuç: Eylemin gerekçesiyle verildiği cümlelerdir. (İçinde 'çünkü, -diğinden, -diği için' olur. Örn: Yağmur yağdığı için sırılsıklam olduk. İki eylem de gerçekleşmiştir!).\n- Amaç-Sonuç: Eylemin hangi hedefle yapıldığını belirtir. (İçinde '-mek için, -mek amacıyla' olur. Örn: Sınavı kazanmak için çok çalışıyor. Sınavı kazanıp kazanmadığı henüz belli değildir!).\n- Koşul-Sonuç: Eylemin gerçekleşmesinin bir şarta bağlı olmasıdır. (İçinde '-se/-sa, -dıkça, üzere' olur. Örn: Ödevini yaparsan dışarı çıkabilirsin).",
        "paragraf": "🧩 [7. Sınıf Türkçe - Paragraf Taktikleri ve Anlam Mimarisi]\n\nYeni nesil LGS tipi soruların kalbidir. Çözüm Taktikleri:\n1. Ana Düşünce (Ana Fikir): Yazarın bize vermek istediği asıl mesaj, öğüttür. Genelde paragrafın son cümlelerinde 'Kısacası, özetle, oysa, bence' gibi kelimelerden sonra gelir.\n2. Yardımcı Düşünce: Paragrafta değinilen diğer yan fikirlerdir. Soru kökü olumsuzdur: 'Hangisine değinilmemiştir?', 'Hangisi çıkarılamaz?'. Bu sorularda önce şıkları oku, şıklardaki anahtar kelimelerin altını çiz, sonra paragrafta o kelimeleri ara!\n3. Paragraf Yapısı: Giriş cümlesi asla 'Ama, fakat, çünkü, bundan dolayı' gibi bağlayıcı kelimelerle BAŞLAMAZ. Akışı bozan cümle, konunun dışına çıkan veya konuya farklı bir bakış açısıyla bakan cümledir.",
        "yazım kuralları": "🔤 [7. Sınıf Türkçe - İmla ve Yazım Kuralları Hileleri]\n\nSınavlarda her sene yüzde yüz çıkan o 3 meşhur kural:\n1. 'de' Bağlacının Yazımı: Cümleden çıkardığında anlam bozulmuyorsa bağlaçtır ve AYRI yazılır. Anlam tamamen saçmalıyorsa ektir, BİTİŞİK yazılır. (Örn: Sen de gel ✅ / Bende kalem var ✅).\n2. 'ki' Bağlacının Yazımı: Pratik Hile: Kelimenin sonuna '-ler' eki getir. Anlamlı oluyorsa bitişik (Örn: Seninki-ler ✅), anlamsız oluyorsa ayrı yazılır (Örn: Duydum ki-ler ❌). İstisna: SOMBAHÇEM (Sanki, Oysaki, Mademki, Belki, Halbuki, Çünkü, Meğerki) kelimelerindeki ki'ler kalıplaştığı için her zaman bitişik yazılır.\n3. Büyük Harflerin Kullanımı: Tarihi olaylar, çağ ve dönem adları büyük harfle başlar (Örn: Kurtuluş Savaşı, Cilalı Taş Devri). Akrabalık bildiren kelimeler KÜÇÜK harfle başlar (Örn: Ayşe teyzem), lakap veya unvan olmuşsa BÜYÜK harfle başlar (Örn: Telli Baba, Nene Hatun).",
        "noktalama işaretleri": "🛑 [7. Sınıf Türkçe - Noktalama İşaretleri Kritik Noktalar]\n\n- Virgül (,): Eş görevli sözcükleri ayırır, sıralı cümleleri ayırır. 🚨 UYARI: Cümle içinde zarf-fiil ekinden (-ip, -erek, -ince vb.) sonra ve şart ekinden (-se/-sa) sonra ASLA virgül gelmez!\n- İki Nokta (:): Kendisinden sonra açıklama yapılacak veya örnek verilecek cümlenin sonuna konur. Örnekler özel isim değilse küçük harfle başlar, açıklama cümlesiyse büyük harfle başlar.\n- Noktalı Virgül (;): İçinde zaten virgül bulunan takımları, grupları veya türleri birbirinden ayırmak için kullanılır. Örn: 'Erkek çocuklara Doğan, Tuğrul; kız çocuklara ise İnci, Çiçek adları verilir.'",
        "anlatım bozuklukları": "❌ [7. Sınıf Türkçe - Anlatım Bozuklukları (Anlamsal/Düzeyli)]\n\n1. Gereksiz Sözcük Kullanımı: Eş anlamlı kelimelerin aynı cümlede bulunması. (Örn: 'Gizli sırrımı' kimseye söyleme. -> Sır zaten gizli olur!).\n2. Sözcüğün Yanlış Anlamda Kullanımı: Kelimelerin karıştırılması. (Örn: Saçlarının çok 'büyüdüğünü' söyledi. -> Saç büyümez, uzar! / Fiyatlar çok 'pahalıydı' -> Fiyat pahalı olmaz, yüksek olur!).\n3. Çelişen Sözcüklerin Kullanımı: Kesinlik ve ihtimal bildiren kelimelerin bir arada olması. (Örn: 'Eminim' bugün 'belki' gelebilir).\n4. Deyim Yanlışlığı: Deyimin cümlenin anlamına uymaması. (Örn: Sevinçten 'etekleri tutuştu'. -> Etekleri tutuşmak korku/telaş anında olur, sevinç için 'etekleri zil çaldı' denmeli!).",
      
        // --- 7. SINIF SOSYAL BİLGİLER ---
        "iletişim": "🗣️ [7. Sınıf Sosyal Bilgiler - İletişim]\n\nEmpati kurmak ve 'Ben dili' kullanmak iletişimi olumlu etkilerken, suçlayıcı olan 'Sen dili' kullanmak ve ön yargılı olmak iletişimi olumsuz etkiler.",
        "osmanlı devleti": "🏰 [7. Sınıf Sosyal Bilgiler - Osmanlı Dönemi]\n\n1299'da kurulan devletin kısa sürede büyüme nedenleri jeopolitik konumu, hoşgörü (istimalet) politikası ve fethedilen yerleri Türkleştiren iskan politikasıdır.",
        "nüfus ve göç": "🗺️ [7. Sınıf Sosyal Bilgiler - Ülkemizde Nüfus ve Yerleşme]\n\nİnsanların yerleşme tercihlerinde doğal (iklim, su) ve beşeri (sanayi, eğitim, iş imkanı) faktörler etkilidir. Göç, ekonomik veya siyasi nedenlerle bir yerden başka yere taşınmaktır.",
        "küresel bağlar": "🌍 [7. Sınıf Sosyal Bilgiler - Küresel Bağlar]\n\nÜlkemizin üye olduğu uluslararası kuruluşları (BM, NATO, İslam İşbirliği Teşkilatı) ve dünyayı ilgilendiren küresel sorunları (iklim değişikliği, kıtlık) kapsar.",

        // --- İNGİLİZCE & DİN KÜLTÜRÜ ---
        "appearance": "👤 [7. Sınıf İngilizce - Appearance and Personality]\n\nİnsanların dış görünüşü (tall, slim) ve kişilik özelliklerini (honest, stubborn) anlatır. Karşılaştırma yaparken sıfatların sonuna '-er' veya başına 'more' getirilir.",
        "biographies": "🇬🇧 [7. Sınıf İngilizce - Biographies]\n\nGeçmiş zaman (Past Simple Tense) kuralları işlenir. Düzenli fiiller '-ed' alır, düzensiz fiiller tamamen değişir.",

        // --- 7. SINIF DİN KÜLTÜRÜ (ULTRA DETAYLI & KAVRAMSAL) ---
        "melek ve ahiret": "🌙 [7. Sınıf Din Kültürü - Melek ve Ahiret İnancı]\n\nGözle görülmeyen ama varlığına iman ettiğimiz nurani varlıklar ve dünya hayatının sonrasıdır. Sınavda Çıkacak Altın Bilgiler:\n\n1. Dört Büyük Melek ve Görevleri:\n   • Cebrail: Vahiy getirmekle görevlidir (Allah ile peygamberler arası elçi).\n   • Azrail: Eceli gelen canlıların ruhunu teslim almakla görevlidir.\n   • Mikail: Tabiat olaylarını (yağmur, rüzgar vb.) ve rızıkları idare eder.\n   • İsrafil: Kıyamet günü ve yeniden dirilişte 'Sûr' borusuna üflemekle görevlidir.\n2. Diğer Önemli Melekler:\n   • Kiramen Kâtibin: Sağımızda ve solumuzda durup sevap ile günahları (amel defterini) yazan yazıcı meleklerdir.\n   • Münker - Nekir: Kabirde insanları ilk sorguya çekecek olan sorgu melekleridir.\n   • Hafaza Melekleri: İnsanları kötülüklerden koruyan koruyucu meleklerdir.",
        "ahiret hayatı": "⏳ [7. Sınıf Din Kültürü - Ahiret Hayatının Aşamaları]\n\nSınavlarda kronolojik sırası (hangisinden sonra hangisi gelir) çok sorulur. Tam sıralama şöyledir:\n1. Ölüm: Dünya hayatının bitişi ve ahiret yolculuğunun başlangıcı.\n2. Kabir (Berzah) Hayatı: Ölümden sonra başlayıp kıyamete kadar sürecek olan geçiş dönemi, 'kabir alemi'.\n3. Kıyamet: İsrafil'in Sûr borusuna İLK kez üflemesiyle dünya hayatının tamamen yok olması.\n4. Ba's (Yeniden Diriliş): İsrafil'in Sûr'a İKİNCİ kez üflemesiyle tüm insanların yeniden diriltilmesi.\n5. Mahşer ve Haşir: Dirilen insanların hesap vermek için toplandığı o devasa meydana 'Mahşer', toplanma eylemine 'Haşir' denir.\n6. Amel Defteri ve Hesap: Kiramen Katibin meleklerinin yazdığı defterlerin açılması ve sorgulanma evresi.\n7. Mizan: Ahirette günah ve sevapların, amellerin tartıldığı o manevi, hassas adalet terazisi.\n8. Sırat Köprüsü, Cennet ve Cehennem: Hesaplaşma bittikten sonra amellere göre varılacak ebedi son duraklar.",
        "hac ve kurban": "🕋 [7. Sınıf Din Kültürü - Hac İbadeti ve Mekânları]\n\nHac; durumu iyi olan Müslümanların yılın belirli günlerinde Kabe'yi ve kutsal mekanları ibadet niyetiyle ziyaret etmesidir. Haccın farzları (rükunları) şunlardır:\n\n1. İhram: Hac veya umreye niyet eden kişinin, diğer zamanlarda helal olan bazı davranışları kendine haram kılması ve beyaz dikişsiz kıyafete bürünmesi. (Şarttır)\n2. Arafat Vakfesi: Zilhicce ayının 9. günü (Arife günü) Arafat dağında bir müddet bekleyip dua etmektir. Vakfe yapmayan hacı olamaz!\n3. Ziyaret Tavafı: Kabe'nin etrafında Hacerüleved köşesinden başlayarak 7 kez dönmektir. Bu 7 dönüşün her birine 'Şavt', toplamına 'Tavaf' denir.\n\n📌 Diğer Önemli Hac Kavramları:\n- Sa'y: Safa ve Merve tepeleri arasında 4 gidiş 3 geliş olmak üzere 7 kez hızlıca yürümektir (Hz. Hacer'in su arayışının sembolüdür).\n- Müzdelife ve Mina: Arafat'tan sonra vakfe yapılan, şeytan taşlanan ve kurban kesilen kutsal bölgeler.\n- Umre: Belirli bir vakte bağlı kalmadan (Hac dönemi dışında) ihrama girip sadece Tavaf ve Sa'y yaparak yapılan sünnet ibadettir. Umre'de Vakfe, Şeytan Taşlama ve Kurban YOKTUR!",
        "kurban": "🐑 [7. Sınıf Din Kültürü - Kurban İbadeti ve Türleri]\n\nAllah'a yakınlaşmak ve O'nun rızasını kazanmak amacıyla belirli şartları taşıyan hayvanı ibadet niyetiyle kesmektir. Kurban eti genel olarak 3 eşit parçaya bölünür (Üçte biri ev halkına, üçte biri misafirlere, üçte biri ise yoksullara dağıtılır).\n\n📌 Sınavda Çıkan Kurban Çeşitleri:\n- Udhiyye: Kurban bayramı günlerinde kesilen vacip olan normal kurban.\n- Adak (Nezir) Kurbanı: Bir işin, bir dileğin gerçekleşmesi şartına bağlı olarak kesilen kurbandır. (🚨 Dikkat: Adak adayan kişi ve ailesi bu etten ASLA yiyemez, tamamı fakirlere dağıtılmalıdır!).\n- Akika Kurbanı: Yeni çocuk sahibi olan anne-babanın Allah'a şükretmek amacıyla kestiği sünnet kurbandır (Ailesi yiyebilir).\n- Şükür Kurbanı: Herhangi bir nimet veya güzel olay karşısında Allah'a teşekkür etmek için kesilen kurban.",
        "ahlaki davranışlar": "🤝 [7. Sınıf Din Kültürü - Güzel Ahlaki Tutum ve Davranışlar]\n\nİslam dininin insan ilişkilerinde emrettiği temel ahlaki erdemlerdir:\n- Adalet: Her hak sahibine hakkını vermek, her şeyi olması gereken yere koymak ve zulmetmemektir.\n- Dostluk ve Kardeşlik: Maddi ve manevi çıkarlardan uzak, sadece Allah rızası için birini sevmek ve zor anında yanında olmaktır.\n- Dürüstlük ve Doğruluk: Özü sözü bir olmak, yalan söylememek ve hile yapmamaktır (Peygamberlerin 'Sıdk' sıfatıyla eşleşir).\n- Öz Denetim (Oto-kontrol): İnsanın dışarıdan bir baskı olmadan, kendi davranışlarını, arzularını ve öfkesini inancına göre kontrol edebilme yeteneğidir.\n- Sabır: Karşılaşılan zorluklar, musibetler veya dertler karşısında yılgınlık göstermeyip direnç göstermek ve Allah'a tevekkül etmektir.",
        "maun suresi": "📖 [7. Sınıf Din Kültürü - Maûn Suresi ve Anlamı]\n\nKur'an-ı Kerim'in 107. suresidir. 'Maûn' kelime anlamı olarak 'yardım, zekat veya küçük bir iyilik' demektir. Surenin sınavda çıkan ana mesajı şudur:\n\n⚠️ Surede İki Tip İnsan Eleştirilir:\n1. Ahiret gününü ve hesap vermeyi yalanlayan, yetimi itip kakan, yoksulu doyurmayı teşvik etmeyen merhametsiz kişiler.\n2. Namazlarını ciddiye almayan, namazlarıyla sadece insanlara GÖSTERİŞ (Riya) yapan ve en küçük bir yardıma dahi engel olan ikiyüzlüler (münafıklar).",

    // İleri Seviye Metin Mesafe/Benzerlik Algoritması (Levenshtein Distance)
    function getSimilarityScore(str1, str2) {
        const track = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));
        for (let i = 0; i <= str1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= str2.length; j += 1) track[j][0] = j;
        for (let j = 1; j <= str2.length; j += 1) {
            for (let i = 1; i <= str1.length; i += 1) {
                const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        return track[str2.length][str1.length];
    }

    // 🔥 YENİ NESİL GELİŞMİŞ DOĞAL DİL İŞLEME VE ÇOKLU İSTEK MOTORU 🔥
    function akilliCevapMotoru(cumle) {
        // Türkçe karakterleri standardize et, noktalama işaretlerini sil
        let temizCumle = cumle.toLowerCase()
            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g,"")
            .replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u")
            .replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c");

        let bulunanSonuclar = [];
        let yakalananKelimeler = [];

        // Sözlükteki her bir kelime grubu için cümlenin içinde arama yap
        for (let sozlukKelimesi in OZEL_SOZLUK) {
            let standartSozlukKey = sozlukKelimesi.toLowerCase()
                .replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u")
                .replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c");

            // 1. Doğrudan İçerme Kontrolü (Cümle içinde tam kelime veya kökü geçiyor mu?)
            // Örn: "hücreler", "hücreyi", "hücreye" kelimeleri "hücre"yi tetikler
            if (temizCumle.includes(standartSozlukKey)) {
                if (!yakalananKelimeler.includes(sozlukKelimesi)) {
                    bulunanSonuclar.push(OZEL_SOZLUK[sozlukKelimesi]);
                    yakalananKelimeler.push(sozlukKelimesi.toUpperCase());
                }
                continue; // Yakalandıysa bir sonrakine geç
            }

            // 2. Harf Hata Toleransı Kontrolü (Kullanıcı harfi yanlış yazdıysa tolerans)
            let cumleKelimeleri = temizCumle.split(" ");
            for (let cKelime of cumleKelimeleri) {
                if (cKelime.length >= 4 && standartSozlukKey.length >= 4) {
                    let mesafe = getSimilarityScore(cKelime, standartSozlukKey);
                    // Kelime uzunluğuna göre 1 veya 2 harf hatasını kabul et
                    if (mesafe <= 1 || (standartSozlukKey.includes(cKelime) && cKelime.length >= 4)) {
                        if (!yakalananKelimeler.includes(sozlukKelimesi)) {
                            bulunanSonuclar.push(OZEL_SOZLUK[sozlukKelimesi]);
                            yakalananKelimeler.push(sozlukKelimesi.toUpperCase());
                        }
                    }
                }
            }
        }

        // Eğer cümleden birden fazla kelime/konu yakalandıysa, hepsini alt alta birleştir!
        if (bulunanSonuclar.length > 0) {
            let baslik = yakalananKelimeler.join(" + ");
            let birlesikCevap = `🧠 [İman Power Analiz Motoru]\n🤖 Sorduğun cümle içerisinden şu konuları tespit ettim: ${baslik}\n\n`;
            birlesikCevap += bulunanSonuclar.join("\n\n----------------------------\n\n");
            return birlesikCevap;
        }

        // Klasik Akıllı Soru Kalıpları Kontrolü
        if (temizCumle.includes("nasil basarili") || temizCumle.includes("basari yolu") || temizCumle.includes("ders calismak")) {
            return "🚀 Başarılı olmanın sırrı İman Power felsefesinde saklıdır: Hedef belirle, dikkat dağıtıcıları kapat, buradaki 7. sınıf özetlerini tekrar et ve her gün kararlılıkla çalış!";
        }
        if (temizCumle.includes("ne yapiyor") || temizCumle.includes("ne is yaparsin") || temizCumle.includes("gorevin ne")) {
            return "⚙️ Şu an senin girdilerini kelime kelime analiz ediyor, cümlenin köklerini çözümlüyor ve Firebase veritabanını canlı tutuyorum.";
        }
        if (temizCumle.includes("kimsin") || temizCumle.includes("adin ne") || temizCumle.includes("sen kimsin")) {
            return "🤖 Ben İman Power Zeka'yım. Çoklu istekleri ayırt edebilen profesyonel bir kod mimarisine sahibim!";
        }

        // Eğer hiçbir kelime eşleşmediyse üretilecek ultra esnek profesyonel yanıt
        return `🤔 Cümleni ("${cumle}") kelime kelime taradım ancak veri tabanındaki 7. sınıf ders konuları veya etkileşim kelimeleriyle tam bir bağ kuramadım.\n\n💡 İpucu: Bana aynı anda birden fazla şey sorabilirsin! Örneğin: 'Bana rasyonel sayılar ve hücre konusunu anlat, üstüne bir de espri yap' yazarak beni test edebilirsin!`;
    }

    // EKRAN VE FIREBASE SİSTEMİ KONTROLLERİ
    window.switchScreen = function(screenId) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('register-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'none';
        
        const container = document.getElementById('main-container');
        if(screenId === 'chat-screen') {
            document.getElementById(screenId).style.display = 'flex';
            container.style.maxWidth = "650px"; // Geniş cevaplar için ekranı büyüttük
        } else {
            document.getElementById(screenId).style.display = 'block';
            container.style.maxWidth = "480px";
        }
    }

    window.register = function() {
        const user = document.getElementById('reg-username').value.trim().toLowerCase();
        const pass = document.getElementById('reg-password').value;
        if(!user || !pass) return alert("Boş alan bırakmayalım lütfen!");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists()) {
                alert("Bu kullanıcı adı alınmış.");
            } else {
                set(ref(db, 'users/' + user), { password: pass, chatHistory: "" }).then(() => {
                    alert("Profil başarıyla oluşturuldu.");
                    switchScreen('login-screen');
                });
            }
        }).catch(err => alert("Kayıt Hatası: " + err.message));
    }

    window.login = function() {
        const user = document.getElementById('login-username').value.trim().toLowerCase();
        const pass = document.getElementById('login-password').value;
        if(!user || !pass) return alert("Lütfen bilgileri girin.");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val().password === pass) {
                currentUsername = user;
                document.getElementById('welcome-user').innerText = `⚡ ${user.toUpperCase()}`;
                switchScreen('chat-screen');
                loadChatHistory();
            } else {
                alert("Hatalı giriş.");
            }
        }).catch(err => alert("Giriş Hatası: " + err.message));
    }

    function loadChatHistory() {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = "";
        const dbRef = ref(db);
        get(child(dbRef, `users/${currentUsername}/chatHistory`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val() !== "") {
                const history = JSON.parse(snapshot.val());
                history.forEach(msg => appendMessage(msg.text, msg.sender));
            } else {
                appendMessage("🔥 İman Power Pro Engine Devreye Girdi.\nArtık uzun cümleler kurabilir, aynı anda birden fazla konuyu (Örn: 'hücre ve tam sayılar anlat bi de saka yap') sorabilirsin. Hepsini anlarım!", "ai");
            }
        });
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg');
        msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.sendMessage = function() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;

        appendMessage(text, 'user');
        input.value = "";

        setTimeout(() => {
            let yapayZekaCevabi = akilliCevapMotoru(text);
            appendMessage(yapayZekaCevabi, 'ai');
            saveCurrentChat();
        }, 500);
    }

    function saveCurrentChat() {
        const chatBox = document.getElementById('chat-box');
        const messages = [];
        chatBox.querySelectorAll('.msg').forEach(msgDiv => {
            const sender = msgDiv.classList.contains('user-msg') ? 'user' : 'ai';
            messages.push({ text: msgDiv.innerText, sender: sender });
        });
        set(ref(db, `users/${currentUsername}/chatHistory`), JSON.stringify(messages));
    }

    window.logout = function() {
        currentUsername = "";
        switchScreen('login-screen');
    }
</script>
</body>
</html>
