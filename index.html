    // Harf tolerans algoritması
    function getSimilarityScore(str1, str2) {
        const track = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));
        for (let i = 0; i <= str1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= str2.length; j += 1) track[j][0] = j;
        for (let j = 1; j <= str2.length; j += 1) {
            for (let i = 1; i <= str1.length; i += 1) {
                const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        return track[str2.length][str1.length];
    }

    // Akıllı ve Gerçekçi Cevap Motoru
    function akilliCevapMotoru(cumle) {
        const temizCumle = cumle.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
        const kelimeler = temizCumle.split(" ");
        let bulunanAnlamlar = [];
        let yakalananKelimeler = [];

        for (let kelime of kelimeler) {
            if (kelime.length < 3) continue;

            let enYakinKelime = "";
            let enDusukMesafe = 3; 

            for (let sozlukKelimesi in OZEL_SOZLUK) {
                let mesafe = getSimilarityScore(kelime, sozlukKelimesi);
                if (mesafe < enDusukMesafe) {
                    enDusukMesafe = mesafe;
                    enYakinKelime = sozlukKelimesi;
                }
            }

            if (enYakinKelime) {
                bulunanAnlamlar.push(OZEL_SOZLUK[enYakinKelime]);
                yakalananKelimeler.push(enYakinKelime.toUpperCase());
            }
        }

        if (bulunanAnlamlar.length > 0) {
            let baslik = yakalananKelimeler.join(" ve ");
            return `🔍 [${baslik}] analizi:\n\n` + bulunanAnlamlar.join("\n\n");
        }

        if (temizCumle.includes("nasil basarili") || temizCumle.includes("nasil basarili olurum") || temizCumle.includes("basari yolu")) {
            const basariCevaplari = [
                "Başarılı olmak net bir hedef belirlemek, her gün taviz vermeden disiplinli çalışmak ve başarısızlıklardan ders çıkarmakla mümkündür. Çok çalışmak bu işin anahtarıdır.",
                "Sürekli ve odaklanmış çalışarak başarılı olursun. Rotanı çiz, dikkatini dağıtan şeyleri hayatından çıkar ve pes etmeden devam et.",
                "Başarının formülü basittir: Doğru strateji, çok çalışmak ve süreklilik. Ertelemeyi bıraktığın gün başarın katlanacaktır."
            ];
            return basariCevaplari[Math.floor(Math.random() * basariCevaplari.length)];
        }

        if (temizCumle.includes("ne yapiyorsun") || temizCumle.includes("ne is yaparsin")) {
            return "Şu an senin girdilerini analiz ediyorum, kod tabanımı stabil tutmaya çalışıyorum.";
        }

        if (temizCumle.includes("kimsin") || temizCumle.includes("adin ne")) {
            return "Ben İman Power Zeka. Tek bir index.html dosyasında yaşayan, sözlüğe ve kurallara dayalı akıllı bir asistanım.";
        }

        const standartCevaplar = [
            `"${cumle}" ifadesini analiz ettim. Bu kelimeler şu anki bilgi haznemde veya sözlüğümde doğrudan kayıtlı değil. İleride buraya yeni mantıksal kurallar ekleyebilirsin.`,
            `Girdiğin "${cumle}" mesajına dair net bir eşleşme bulamadım. Kod bloğundaki kuralları geliştirerek beni daha akıllı yapabilirsin.`,
            `Anladım, fakat "${cumle}" sorusu hakkında henüz eğitilmedim. Kodun içerisine bu soru için yeni bir kalıp eklememizi ister misin?`
        ];
        return standartCevaplar[Math.floor(Math.random() * standartCevaplar.length)];
    }

    // EKRAN VE FIREBASE SİSTEMİ KONTROLLERİ
    window.switchScreen = function(screenId) {
        document.getElementById('login-screen').style.display = 'none';

            container.style.maxWidth = "600px";
        } else {
            document.getElementById(screenId).style.display = 'block';
            container.style.maxWidth = "480px";
        }

    window.register = function() {
        const user = document.getElementById('reg-username').value.trim().toLowerCase();

            if (snapshot.exists()) {
                alert("Bu kullanıcı adı alınmış.");
            } else {
                set(ref(db, 'users/' + user), { password: pass, chatHistory: "" }).then(() => {
                    alert("Profil başarıyla oluşturuldu.");
                    switchScreen('login-screen');
                });
            }
        }).catch(err => alert("Kayıt Hatası: " + err.message));
    }

    window.login = function() {
        const user = document.getElementById('login-username').value.trim().toLowerCase();
        const pass = document.getElementById('login-password').value;
        if(!user || !pass) return alert("Lütfen bilgileri girin.");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val().password === pass) {
                currentUsername = user;
                document.getElementById('welcome-user').innerText = `⚡ ${user.toUpperCase()}`;
                switchScreen('chat-screen');
                loadChatHistory();
            } else {
                alert("Hatalı giriş.");
            }
        }).catch(err => alert("Giriş Hatası: " + err.message));
    }

    function loadChatHistory() {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = "";
        const dbRef = ref(db);
        get(child(dbRef, `users/${currentUsername}/chatHistory`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val() !== "") {
                const history = JSON.parse(snapshot.val());
                history.forEach(msg => appendMessage(msg.text, msg.sender));
            } else {
                appendMessage("Sistem Aktif. Sorularınızı veya sözlükteki kelimeleri yazabilirsiniz. Yanlış yazımları otomatik algılarım.", "ai");
            }
        });
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg');
        msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.sendMessage = function() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;

        appendMessage(text, 'user');
        input.value = "";

        setTimeout(() => {
            let yapayZekaCevabi = akilliCevapMotoru(text);
            appendMessage(yapayZekaCevabi, 'ai');
            saveCurrentChat();
        }, 550);
    }

    function saveCurrentChat() {
        const chatBox = document.getElementById('chat-box');
        const messages = [];
        chatBox.querySelectorAll('.msg').forEach(msgDiv => {
            const sender = msgDiv.classList.contains('user-msg') ? 'user' : 'ai';
            messages.push({ text: msgDiv.innerText, sender: sender });
        });
        set(ref(db, `users/${currentUsername}/chatHistory`), JSON.stringify(messages));
    }

    window.logout = function() {
        currentUsername = "";
        switchScreen('login-screen');
    }
</script>
</body>
</html>
