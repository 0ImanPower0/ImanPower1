<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power Zeka</title>
    <style>
        /* Modern ve Şık Tasarım */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #00adb5; margin-top: 0; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2d2d2d;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00adb5;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { background: #007a80; }
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #bbb;
            cursor: pointer;
        }
        .toggle-link span { color: #00adb5; text-decoration: underline; }
        
        /* Sohbet Ekranı Tasarımı */
        #chat-screen { display: none; height: 80vh; flex-direction: column; }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #181818;
            margin-bottom: 10px;
        }
        .msg { margin: 10px 0; padding: 10px; border-radius: 8px; max-width: 80%; }
        .user-msg { background: #00adb5; margin-left: auto; text-align: right; }
        .ai-msg { background: #333; margin-right: auto; }
        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { margin: 0; }
        .chat-input-area button { margin: 0; width: auto; px: 20px; }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logout-btn { background: #ff4444; padding: 5px 10px; font-size: 12px; width: auto; margin: 0; }
        .logout-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h2>İman Power Zeka - Giriş</h2>
        <input type="text" id="login-username" placeholder="Kullanıcı Adı">
        <input type="password" id="login-password" placeholder="Şifre">
        <button onclick="login()">Giriş Yap</button>
        <div class="toggle-link" onclick="switchScreen('register-screen')">Hesabın yok mu? <span>Kayıt Ol</span></div>
    </div>

    <div id="register-screen" style="display: none;">
        <h2>İman Power Zeka - Kayıt</h2>
        <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
        <input type="password" id="reg-password" placeholder="Şifre">
        <button onclick="register()">Kayıt Ol</button>
        <div class="toggle-link" onclick="switchScreen('login-screen')">Zaten üye misin? <span>Giriş Yap</span></div>
    </div>

    <div id="chat-screen">
        <div class="header-area">
            <h3 style="margin:0; color:#00adb5;" id="welcome-user">Merhaba</h3>
            <button class="logout-btn" onclick="logout()">Çıkış</button>
        </div>
        <div id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Mesajınızı yazın..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>
</div>

<script type="module">
    // Attığın fotoğraftaki Firebase SDK'ları ve ayarları
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDy4ZUv_wZsntWSIDbcolvpqDTBvWuSdrk",
        authDomain: "imanpowerveri.firebaseapp.com",
        databaseURL: "https://imanpowerveri-default-rtdbe.firebaseio.com",
        projectId: "imanpowerveri",
        storageBucket: "imanpowerveri.firebasestorage.app",
        messagingSenderId: "891464029314",
        appId: "1:891464029314:web:581bd3b2ed3d7c6af2d09b",
        measurementId: "G-4T6XSDBDL5"
    };

    // Firebase Başlatma
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUsername = "";

    // Ekran Değiştirme Fonksiyonu
    window.switchScreen = function(screenId) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('register-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'none';
        
        if(screenId === 'chat-screen') {
            document.getElementById(screenId).style.display = 'flex';
        } else {
            document.getElementById(screenId).style.display = 'block';
        }
    }

    // KAYIT OLMA FONKSİYONU
    window.register = function() {
        const user = document.getElementById('reg-username').value.trim().toLowerCase();
        const pass = document.getElementById('reg-password').value;

        if(!user || !pass) return alert("Lütfen tüm alanları doldurun!");

        const dbRef = ref(db);
        // Kullanıcı adının önceden alınıp alınmadığını kontrol et
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists()) {
                alert("Bu kullanıcı adı zaten alınmış!");
            } else {
                // Kullanıcıyı veritabanına kaydet
                set(ref(db, 'users/' + user), {
                    password: pass,
                    chatHistory: ""
                }).then(() => {
                    alert("Kayıt başarıyla tamamlandı! Giriş yapabilirsiniz.");
                    switchScreen('login-screen');
                });
            }
        });
    }

    // GİRİŞ YAPMA FONKSİYONU
    window.login = function() {
        const user = document.getElementById('login-username').value.trim().toLowerCase();
        const pass = document.getElementById('login-password').value;

        if(!user || !pass) return alert("Lütfen tüm alanları doldurun!");

        const dbRef = ref(db);
        get(child(dbRef, `users/${user}`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val().password === pass) {
                currentUsername = user;
                document.getElementById('welcome-user').innerText = `Üye: ${user}`;
                switchScreen('chat-screen');
                loadChatHistory(); // Eski sohbeti yükle
            } else {
                alert("Hatalı kullanıcı adı veya şifre!");
            }
        }).catch((error) => {
            alert("Giriş yapılırken hata oluştu: " + error.message);
        });
    }

    // SOHBET GEÇMİŞİNİ YÜKLEME
    function loadChatHistory() {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = ""; // Temizle
        
        const dbRef = ref(db);
        get(child(dbRef, `users/${currentUsername}/chatHistory`)).then((snapshot) => {
            if (snapshot.exists() && snapshot.val() !== "") {
                const history = JSON.parse(snapshot.val());
                history.forEach(msg => {
                    appendMessage(msg.text, msg.sender);
                });
            } else {
                // Hoş geldin mesajı (Yapay zekadan)
                appendMessage("Merhaba! Ben İman Power Zeka. Size nasıl yardımcı olabilirim?", "ai");
            }
        });
    }

    // MESAJI EKRANA YAZDIRMA
    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg');
        msgDiv.classList.add(sender === 'user' ? 'user-msg' : 'ai-msg');
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // Otomatik aşağı kaydır
    }

    // MESAJ GÖNDERME VE YAPAY ZEKA CEVABI
    window.sendMessage = function() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;

        // Kullanıcı mesajını ekle
        appendMessage(text, 'user');
        input.value = "";

        // Basit / Geçici Yapay Zeka Cevap Mekanizması (Simülasyon)
        // Gerçek bir AI API'si (OpenAI, Gemini vb.) bağlayana kadar burası otomatik cevap verir.
        setTimeout(() => {
            const aiResponse = `[İman Power Zeka]: "${text}" mesajını aldım. Şu an test aşamasındayım!`;
            appendMessage(aiResponse, 'ai');
            
            // Yeni sohbet durumunu Firebase'e kaydet
            saveCurrentChat();
        }, 1000);
    }

    // SOHBETİ FIREBASE'E KAYDETME (Kaldığı yerden devam etmesi için)
    function saveCurrentChat() {
        const chatBox = document.getElementById('chat-box');
        const messages = [];
        
        chatBox.querySelectorAll('.msg').forEach(msgDiv => {
            const sender = msgDiv.classList.contains('user-msg') ? 'user' : 'ai';
            messages.push({ text: msgDiv.innerText, sender: sender });
        });

        set(ref(db, `users/${currentUsername}/chatHistory`), JSON.stringify(messages));
    }

    // ÇIKIŞ YAPMA
    window.logout = function() {
        currentUsername = "";
        document.getElementById('login-username').value = "";
        document.getElementById('login-password').value = "";
        switchScreen('login-screen');
    }
</script>
</body>
</html>
