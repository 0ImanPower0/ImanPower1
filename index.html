<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power FC | 7/24 Canlı Destek Merkezi</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.95);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.5);
            --text: #f8fafc;
            --border: rgba(16, 185, 129, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        /* --- GİRİŞ EKRANI --- */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .auth-card { background: var(--glass); padding: 40px; border-radius: 30px; border: 2px solid var(--accent); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 40px var(--accent-glow); }
        .auth-card img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 20px; }

        /* --- ÜST PANEL --- */
        .top-bar { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .logo-box { display: flex; align-items: center; gap: 10px; font-family: 'Orbitron'; font-weight: 900; color: var(--accent); }
        .logo-box img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent); }

        /* --- 3 BÖLÜMLÜ DÜZEN --- */
        .main-layout { display: grid; grid-template-columns: 320px 1fr 380px; height: calc(100vh - 70px); background: #0b1329; }

        /* SOL: DESTEK TALEPLERİ LİSTESİ */
        .sidebar { background: #0f172a; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; height: 100%; overflow-y: auto; }
        .ticket-item { padding: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .ticket-item:hover, .ticket-item.active { border-color: var(--accent); background: rgba(16, 185, 129, 0.1); }

        /* ORTA: TEMİZ CHAT ALANI */
        .chat-container { display: flex; flex-direction: column; background: #090f20; border-right: 1px solid var(--border); height: 100%; }
        .chat-header { padding: 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); font-family: 'Orbitron'; font-weight: bold; color: var(--accent); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 12px; }
        .msg { background: rgba(255,255,255,0.04); padding: 12px 18px; border-radius: 16px; border-left: 4px solid var(--accent); max-width: 85%; line-height: 1.5; }

        /* SAĞ: ENTEGRE WEB PENCERESİ (GOOGLE MEET) */
        .web-pane { background: #0f172a; padding: 20px; display: flex; flex-direction: column; height: 100%; }

        /* --- FORMLAR VE ELEMANLAR --- */
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #1e293b; background: #020617; color: white; }
        .btn { padding: 14px; border: none; border-radius: 10px; color: white; font-weight: 800; cursor: pointer; background: var(--accent); width: 100%; transition: 0.3s; text-transform: uppercase; }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--accent-glow); }
        
        .modal { display: none; background: rgba(0,0,0,0.8); position: fixed; inset: 0; z-index: 20000; align-items: center; justify-content: center; }
        .modal-card { background: var(--glass); border: 2px solid var(--accent); padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <img src="logo.png" alt="Logo">
            <h2 id="auth-title" style="margin-bottom:20px; font-family:'Orbitron'; color:var(--accent); letter-spacing: 2px;">DESTEK GİRİŞİ</h2>
            <input type="text" id="u-in" placeholder="Kullanıcı Adı">
            <input type="password" id="p-in" placeholder="Şifre">
            <button class="btn" id="auth-btn" onclick="handleAuth()">GİRİŞ YAP</button>
            <p id="toggle-auth-text" style="margin-top:20px; font-size:0.85rem; cursor:pointer; color:var(--accent);" onclick="toggleAuthMode()">Hesabın yok mu? Kayıt Ol</p>
        </div>
    </div>

    <div class="top-bar">
        <div class="logo-box"><img src="logo.png"> <span>İMAN POWER CANLI DESTEK</span></div>
        <div id="ls-admin-gate" style="display:flex; gap:10px;">
            <input type="password" id="ls-adm-pass" placeholder="Admin Key" style="width:160px; margin:0; padding:8px;">
            <button class="btn" style="width:100px; padding:8px; background:#3b82f6;" onclick="verifyLSAdmin()">ADMİN GİRİŞ</button>
        </div>
        <span id="ls-admin-badge" style="color:#38bdf8; font-weight:bold; display:none; font-family:'Orbitron';">🛠️ YÖNETİCİ (BAŞKAN) MODU</span>
    </div>

    <div class="main-layout">
        
        <div class="sidebar">
            <button class="btn" style="background:#2563eb;" onclick="toggleModal(true)">➕ YENİ DESTEK AÇ</button>
            <div id="support-tickets-container" style="margin-top:10px; display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <div class="chat-container">
            <div id="active-ticket-header" class="chat-header">Lütfen soldan bir destek odası seçin.</div>
            <div id="support-chat-messages" class="chat-messages"></div>
            <div style="display:flex; padding:20px; gap:10px; background:rgba(0,0,0,0.3); border-top:1px solid var(--border);">
                <input type="text" id="tk-msg-input" placeholder="Mesajınızı buraya yazın..." style="margin:0;">
                <button class="btn" style="width:130px;" onclick="sendTicketMessage()">GÖNDER</button>
            </div>
        </div>

        <div class="web-pane">
            <h3 style="font-family:'Orbitron'; color:var(--accent); font-size:1rem; margin-bottom:10px; text-align:center;">MEET CANLI BAĞLANTI</h3>
            <p style="font-size:0.75rem; opacity:0.7; margin-bottom:15px; text-align:center;">Görüntülü veya sesli mülakat odası</p>
            <iframe src="https://meet.google.com" style="width:100%; flex:1; border:none; border-radius:12px; background:#000;"></iframe>
        </div>

    </div>

    <div id="new-ticket-modal" class="modal">
        <div class="modal-card">
            <h3 style="font-family:'Orbitron'; color:#fbbf24; margin-bottom:15px;">Yeni Destek Talebi</h3>
            <p style="font-size:0.75rem; color:#94a3b8; margin-bottom:15px;">İşlemlerinizin hızlı çözülmesi için bilgileri doğru girmeniz zorunludur.</p>
            <input type="text" id="tk-name" placeholder="Adınız Soyadınız">
            <input type="email" id="tk-email" placeholder="Gmail Adresiniz">
            <input type="text" id="tk-phone" placeholder="Telefon Numaranız">
            <label style="font-size:0.75rem; color:#94a3b8; display:block; margin-bottom:5px;">Doğum Tarihi:</label>
            <input type="date" id="tk-birth">
            <button class="btn" style="background:#10b981; margin-top:10px;" onclick="createTicket()">TALEBİ OLUŞTUR VE GÖNDER</button>
            <button class="btn" style="background:#ef4444; margin-top:5px;" onclick="toggleModal(false)">İPTAL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy4ZUv_wZsntWSIDbcOlvpqDTBvWuSdrk",
            authDomain: "imanpowerveri.firebaseapp.com",
            databaseURL: "https://imanpowerveri-default-rtdb.firebaseio.com",
            projectId: "imanpowerveri",
            storageBucket: "imanpowerveri.firebasestorage.app",
            messagingSenderId: "891464029314",
            appId: "1:891464029314:web:581bd3b2ed3d7c6af2d09b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let user = ""; let isRegisterMode = false;
        let activeTicketId = ""; let isLiveSupportAdmin = false;

        window.toggleAuthMode = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "SİSTEME KAYIT" : "DESTEK GİRİŞİ";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "KAYIT OL" : "GİRİŞ YAP";
            document.getElementById('toggle-auth-text').innerText = isRegisterMode ? "Zaten hesabın var mı? Giriş Yap" : "Hesabın yok mu? Kayıt Ol";
        };

        window.handleAuth = () => {
            const username = document.getElementById('u-in').value.trim().toLowerCase();
            const password = document.getElementById('p-in').value;
            if(!username || !password) return alert("Boş bırakılamaz!");
            if(isRegisterMode) {
                set(ref(db, 'users/' + username), { password: password }).then(() => { alert("Kayıt başarılı!"); toggleAuthMode(); });
            } else {
                onValue(ref(db, 'users/' + username), (snap) => {
                    if(snap.exists() && snap.val().password === password) { user = username; document.getElementById('auth-screen').style.display = 'none'; }
                    else alert("Hatalı Giriş!");
                }, { onlyOnce: true });
            }
        };

        window.verifyLSAdmin = () => {
            if(document.getElementById('ls-adm-pass').value === "imanpoweradmini31") {
                isLiveSupportAdmin = true;
                document.getElementById('ls-admin-gate').style.display = 'none';
                document.getElementById('ls-admin-badge').style.display = 'inline-block';
                alert("Hoş geldin Başkan! Tüm destek kanalları açıldı.");
            } else { alert("Hatalı Admin Şifresi!"); }
        };

        window.toggleModal = (show) => { document.getElementById('new-ticket-modal').style.display = show ? 'flex' : 'none'; };

        window.createTicket = () => {
            const name = document.getElementById('tk-name').value.trim();
            const email = document.getElementById('tk-email').value.trim();
            const phone = document.getElementById('tk-phone').value.trim();
            const birth = document.getElementById('tk-birth').value;

            if(!name || !email || !phone || !birth) return alert("Lütfen tüm alanları doldurun!");

            onValue(ref(db, 'support_tickets'), (snap) => {
                const count = snap.exists() ? Object.keys(snap.val()).length + 1 : 1;
                const ticketKey = `Destek ${count}`;

                set(ref(db, 'support_tickets/' + ticketKey), {
                    label: ticketKey, name, email, phone, birth, creator: user, timestamp: Date.now()
                }).then(() => {
                    alert("Destek talebi başarıyla açıldı!");
                    toggleModal(false);
                });
            }, { onlyOnce: true });
        };

        window.selectTicket = (id) => {
            activeTicketId = id;
            document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('active'));
            const targetEl = document.getElementById('tk-item-' + id);
            if(targetEl) targetEl.classList.add('active');
            document.getElementById('active-ticket-header').innerText = `💬 AKTİF KANAL: ${id}`;

            onValue(ref(db, 'support_chats/' + id), (snap) => {
                if(activeTicketId !== id) return;
                const msgBox = document.getElementById('support-chat-messages');
                msgBox.innerHTML = "";
                if(snap.exists()) {
                    Object.values(snap.val()).forEach(msg => {
                        const borderSide = msg.role === 'admin' ? '#3b82f6' : 'var(--accent)';
                        msgBox.innerHTML += `<div class="msg" style="border-left-color: ${borderSide}"><b>${msg.sender}:</b> ${msg.text}</div>`;
                    });
                    msgBox.scrollTop = msgBox.scrollHeight;
                }
            });
        };

        window.sendTicketMessage = () => {
            const input = document.getElementById('tk-msg-input');
            const txt = input.value.trim();
            if(!activeTicketId || !txt) return;

            push(ref(db, 'support_chats/' + activeTicketId), {
                sender: isLiveSupportAdmin ? "Başkan / Yönetici" : user,
                text: txt,
                role: isLiveSupportAdmin ? "admin" : "user",
                timestamp: Date.now()
            }).then(() => { input.value = ''; });
        };

        // REAL-TIME VERİ TABANI DİNLEME (SOL LİSTEYİ GÜNCELLEME)
        onValue(ref(db, 'support_tickets'), (snap) => {
            const tkContainer = document.getElementById('support-tickets-container');
            tkContainer.innerHTML = "";
            if(snap.exists()) {
                Object.entries(snap.val()).forEach(([key, val]) => {
                    // Admin değilse ve bilet başkasınaysa gösterme gizliliği
                    if(!isLiveSupportAdmin && val.creator !== user) return;

                    tkContainer.innerHTML += `<div class="ticket-item ${activeTicketId === key ? 'active' : ''}" id="tk-item-${key}" onclick="selectTicket('${key}')">
                        <div style="font-weight:900; color:var(--accent); font-family:'Orbitron'; font-size:0.85rem;">📌 ${key}</div>
                        <div style="font-size:0.75rem; margin-top:4px;">İsim: ${val.name}</div>
                        <div style="font-size:0.65rem; color:#64748b; margin-top:2px;">Gmail: ${val.email}</div>
                    </div>`;
                });
            }
        });
    </script>
</body>
</html>
